<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>둥지 미화관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--blue:#3B8CE4;--blue-d:#1f6fc9;--blue-l:#e8f1fc;--ink:#1b2733;--mut:#6b7785;--line:#e4e9f0;--bg:#f3f6fb;--card:#fff;
--green:#1a9e6a;--green-l:#e6f6ee;--red:#e0455a;--red-l:#fceaed;--amber:#e08a1a;--amber-l:#fdf2e3;--night:#5b46c9;--night-l:#ece9fb;
--teal:#127e8a;--teal-l:#e2f3f4;--purple:#7a4ec0;--purple-l:#f0eafb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
header{background:linear-gradient(120deg,#2b6fc0,#3B8CE4);color:#fff;padding:18px 22px;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(31,111,201,.25)}
.hbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;max-width:1340px;margin:0 auto}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:38px;height:38px;border-radius:10px;background:#fff;color:var(--blue);display:grid;place-items:center;font-weight:900;font-size:19px}
.brand h1{font-size:16px;font-weight:700;letter-spacing:-.3px}
.brand p{font-size:11.5px;opacity:.9;font-weight:400}
.mctrl{display:flex;align-items:center;gap:8px}.mctrl input{border:none;border-radius:8px;padding:7px 10px;font-family:inherit;font-weight:700;font-size:13px;color:var(--ink)}
.tabs{display:flex;gap:4px;background:#fff;padding:6px;max-width:1340px;margin:14px auto 0;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);overflow-x:auto}
.tab{flex:1;min-width:76px;border:none;background:none;padding:10px 8px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:700;color:var(--mut);cursor:pointer;white-space:nowrap;transition:.15s}
.tab.on{background:var(--blue);color:#fff}.tab:not(.on):hover{background:var(--blue-l);color:var(--blue-d)}
.wrap{max-width:1340px;margin:0 auto;padding:18px}
.view{display:none;animation:fade .25s}.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.pbanner{background:var(--purple-l);border:1px solid #ddd0f3;color:var(--purple);border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(20,40,80,.06);border:1px solid var(--line)}
.kpi .lab{font-size:12px;color:var(--mut);font-weight:500;margin-bottom:6px}
.kpi .val{font-size:21px;font-weight:900;letter-spacing:-.5px}.kpi .sub{font-size:11.5px;color:var(--mut);margin-top:3px}
.kpi.accent{background:linear-gradient(135deg,#3B8CE4,#2b6fc0);color:#fff;border:none}.kpi.accent .lab,.kpi.accent .sub{color:rgba(255,255,255,.85)}
.kpi.gd{background:linear-gradient(135deg,#1aa974,#127e6a);color:#fff;border:none}.kpi.gd .lab,.kpi.gd .sub{color:rgba(255,255,255,.85)}
.kpi.pp{background:linear-gradient(135deg,#7a4ec0,#5f3aa0);color:#fff;border:none}.kpi.pp .lab,.kpi.pp .sub{color:rgba(255,255,255,.85)}
.panel{background:var(--card);border-radius:14px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(20,40,80,.06);margin-bottom:16px;overflow:hidden}
.phead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.phead h2{font-size:15px;font-weight:700}.phead .hint{font-size:12px;color:var(--mut);font-weight:400}
.pbody{padding:16px 18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--mut);font-weight:700;background:#fafcff}
td.r,th.r{text-align:right}td.c,th.c{text-align:center}
tr:hover td{background:#fafcff}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.tag.b{background:var(--blue-l);color:var(--blue-d)}.tag.g{background:var(--green-l);color:var(--green)}.tag.a{background:var(--amber-l);color:var(--amber)}
.tag.r{background:var(--red-l);color:var(--red)}.tag.n{background:var(--night-l);color:var(--night)}.tag.t{background:#e2f3f4;color:var(--teal)}
.tag.p{background:var(--purple-l);color:var(--purple)}.tag.gray{background:#eef1f5;color:#7a8693}
.btn{border:none;border-radius:9px;padding:9px 15px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:.15s}
.btn.pri{background:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.ghost:hover{border-color:var(--blue);color:var(--blue-d)}
.btn.sm{padding:6px 11px;font-size:12px}.btn.danger{background:var(--red-l);color:var(--red)}
input,select{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);background:#fff;width:100%}
input:focus,select:focus{outline:none;border-color:var(--blue)}
label.fld{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.sched-wrap{overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;max-width:100%;position:relative;display:block;overscroll-behavior-x:contain}
table.sched{font-size:12px;min-width:max-content;width:max-content}
@media(max-width:640px){.sched-wrap{width:100vw;max-width:100vw;margin-left:-12px;margin-right:-12px;border-left:none;border-right:none;border-radius:0;overflow-x:scroll}.sched-scroll-hint{display:block}.daycell{min-width:58px}.sched-wrap table.sched .who{min-width:118px;width:118px;max-width:118px;padding:6px 8px;font-size:11.5px;overflow:hidden}.sched-wrap table.sched .who div{white-space:normal}.storerow .store-label{max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;padding:6px 8px!important}}
table.sched th,table.sched td{border:1px solid #eef1f6;padding:0}
table.sched .who{position:sticky;left:0;z-index:5;background:#fff;min-width:200px;padding:6px 10px;text-align:left;white-space:normal}
table.sched thead th.who{z-index:6;background:#fafcff}
.daycell{min-width:54px;height:44px;text-align:center;cursor:pointer;user-select:none;font-weight:700;position:relative;transition:.1s;padding:2px}
.daycell:hover{outline:2px solid var(--blue);outline-offset:-2px;z-index:2}
table.sched tr:hover td.who{background:#fff}
table.sched tr:hover td.dc-plan{background:#fff;color:#6b7785}
table.sched tr:hover td.dc-work{background:var(--blue);color:#fff}
table.sched tr:hover td.dc-lead{background:var(--purple);color:#fff}
table.sched tr:hover td.dc-done{background:var(--teal);color:#fff}
table.sched tr:hover td.dc-noshow{background:var(--red-l);color:var(--red)}
table.sched tr:hover td.dc-off{background:#e8ebf0;color:#9aa4b0}
.daycell .nm{font-size:10px;line-height:1.1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60px;display:inline-block}
.daycell .hh{font-size:8.5px;font-weight:500;opacity:.85}
.dc-plan{background:#fff;color:#aeb8c4}
.dc-work{background:var(--blue);color:#fff}
.dc-lead{background:var(--purple);color:#fff}
.dc-done{background:var(--teal);color:#fff}
.dc-noshow{background:var(--red-l);color:var(--red)}
.dc-auto::after{content:'';position:absolute;top:2px;left:2px;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.75)}
.dc-off{background:repeating-linear-gradient(45deg,#f1f3f7,#f1f3f7 4px,#e8ebf0 4px,#e8ebf0 8px);color:#b7c0cc}
.dc-resigned{opacity:0.4!important;filter:grayscale(0.5)}
.daycell .ot{position:absolute;top:1px;right:2px;font-size:8px;color:#ffe39a;font-weight:900}
.dhead{font-size:11px}.dhead.we{color:var(--red)}.dhead.sa{color:var(--blue-d)}.dhead .mo{font-size:8px;color:#9aa4b0}
.storerow td{font-weight:700;padding:6px 10px;font-size:12px}
.storerow.dir td{background:var(--blue-l)!important;color:var(--blue-d)}
.storerow.sub td{background:#e2f3f4!important;color:var(--teal)}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid #dde3ea}
.modal{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;place-items:center;z-index:100;padding:16px;overflow:auto}
.modal.on{display:grid}
.mbox{background:#fff;border-radius:16px;width:100%;max-width:430px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}
.mbox h3{font-size:15px;margin-bottom:4px}.mbox .msub{font-size:12px;color:var(--mut);margin-bottom:14px}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 4px;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.wdrow{display:flex;gap:4px;margin:8px 0}
.wdrow button{flex:1;border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 0;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;color:var(--mut)}
.wdrow button.on{background:var(--blue-l);border-color:var(--blue);color:var(--blue-d)}
.row{display:flex;gap:10px;align-items:flex-end}
.foot{text-align:center;color:var(--mut);font-size:11.5px;padding:24px}
.note-box{background:var(--amber-l);border:1px solid #f3dcb0;color:#8a5e12;border-radius:8px;padding:7px 10px;font-size:11.5px;margin-top:6px}
.card-sub{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fbfdff}

.people-table-wrap{overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;max-width:100%;border:1px solid var(--line);border-radius:12px;display:block;overscroll-behavior-x:contain}
table.people-table{min-width:980px;width:max-content}
.people-scroll-hint{display:none;font-size:11.5px;color:var(--mut);margin-bottom:6px}
@media(max-width:640px){.people-table-wrap{width:calc(100% + 36px);max-width:calc(100% + 36px);margin-left:-18px;margin-right:-18px;border-left:none;border-right:none;border-radius:0;overflow-x:scroll}.people-scroll-hint{display:block}table.people-table{min-width:980px;width:max-content}}
@media(max-width:640px){.kpi .val{font-size:18px}.wrap{padding:12px}}

</style>
</head>

}

/* ---------- pay cycle (25th cutoff) ---------- */
function periodRange(){
  const [y,m]=S.month.split('-').map(Number);
  const startDay=S.settings.cutoffDay||25; // 정산 시작일: 전월 25일
  const start=new Date(y,m-2,startDay);
  const end=new Date(y,m-1,startDay-1); // 정산 종료일: 당월 24일
  return {start,end};
}
function periodDates(){const{start,end}=periodRange();const out=[];const d=new Date(start);while(d<=end){out.push(new Date(d));d.setDate(d.getDate()+1);}return out;}
function iso(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function periodLabel(){const{start,end}=periodRange();return iso(start)+' ~ '+iso(end);}
function ymd(y,m,d){return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function datesBetween(a,b){const out=[];let d=new Date(a+'T00:00:00');const e=new Date(b+'T00:00:00');if(isNaN(d)||isNaN(e)||e<d)return out;let g=0;while(d<=e&&g<400){out.push(new Date(d));d.setDate(d.getDate()+1);g++;}return out;}
function rangeDates(){const r=S.payRange||{preset:'cycle'};const[y,m]=S.month.split('-').map(Number);
  if(r.preset==='custom'&&r.start&&r.end)return datesBetween(r.start,r.end);
  if(r.preset==='m1to25')return datesBetween(ymd(y,m,1),ymd(y,m,25));
  if(r.preset==='mfull'){const last=new Date(y,m,0).getDate();return datesBetween(ymd(y,m,1),ymd(y,m,last));}
  return periodDates();}
function rangeLabel(){const a=rangeDates();if(!a.length)return '\u2014';return iso(a[0])+' ~ '+iso(a[a.length-1]);}

/* ---------- calc ---------- */
function nightHours(startStr,totalH){let[hh,mm]=startStr.split(':').map(Number);let start=hh*60+mm;if(start<720)start+=1440;const end=start+totalH*60;const ov=Math.max(0,Math.min(end,1800)-Math.max(start,1320));return ov/60;}
function t10(n){return Math.floor(n/10)*10;}
function dayPay(wage,reg,ot,nightH){const tot=(reg||0)+(ot||0);const base=t10(tot*wage);const nh=Math.max(0,Math.min(nightH||0,tot));const night=t10(nh*wage*S.settings.nightRate);const otp=t10((ot||0)*wage*S.settings.otRate);return{base,night,ot:otp,hours:tot,nighthours:nh,total:base+night+otp};}
function attNight(a){if(!a||a.status!=='work')return 0;const reg=a.reg||0,ot=a.ot||0;if(a.nReg!=null||a.nOt!=null)return (a.nReg||0)+(a.nOt||0);if(a.noNight)return 0;return nightHours(S.settings.shiftStart,reg+ot);}
function hmLabel(dec){const t=Math.round((dec||0)*60);const h=Math.floor(t/60),m=t%60;if(!t)return '0';return (h?h+'h':'')+(m?(h?' ':'')+m+'m':'');}
function hmParts(dec){const t=Math.round((dec||0)*60);return{h:Math.floor(t/60),m:t%60};}
function shiftDur(start,end){let[a,b]=(start||'22:00').split(':').map(Number);let[c,d]=(end||'00:00').split(':').map(Number);let s=a*60+b,e=c*60+d;let diff=e-s;if(diff<=0)diff+=1440;return diff;}
function shiftDurLabel(start,end){return hmLabel(shiftDur(start,end)/60);}

function rangeOverlapsDates(startStr,endStr,dates){if(!dates||!dates.length)return true;const rs=dates[0],re=dates[dates.length-1];const s=parseDateOrNull(startStr),e=parseDateOrNull(endStr);if(s&&re<s)return false;if(e&&rs>e)return false;return true;}
function dateInRange(dt,startStr,endStr){const s=parseDateOrNull(startStr),e=parseDateOrNull(endStr);if(s&&dt<s)return false;if(e&&dt>e)return false;return true;}
function makeSubContract(store,c,idx){c=c||{};const id=c.id||('SUBC_'+store.id+'_'+idx);return{...store,...c,id:id,contractId:id,storeId:store.id,store:store,name:store.name,region:store.region,award:store.award,active:store.active};}
function currentSubContract(store){if(!isSub(store))return null;if(!(store.subVendor||store.subFee||store.contractStart||store.contractEnd))return null;return makeSubContract(store,{id:'CUR_'+store.id,subVendor:store.subVendor,subFee:store.subFee,subContact:store.subContact,contractStart:store.contractStart,contractEnd:store.contractEnd,bizName:store.bizName,bizNo:store.bizNo,bizOwner:store.bizOwner,bizType:store.bizType,bizItem:store.bizItem,bizAddr:store.bizAddr,bizEmail:store.bizEmail,bankName:store.bankName,bankAccount:store.bankAccount,bankHolder:store.bankHolder,isCurrent:true},'CUR');}
function subContractsOf(store){const out=[];(store.subContracts||[]).forEach((c,i)=>out.push(makeSubContract(store,c,i)));const cur=currentSubContract(store);if(cur)out.push(cur);return out;}
function allSubContracts(){return S.stores.flatMap(subContractsOf);}
function subSettlementDates(s,dates){return (dates||rangeDates()).filter(dt=>dateInRange(dt,s.contractStart,s.contractEnd));}
function monthDaysOf(dt){return new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();}
function ymOf(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');}
function subProration(s,dates){
  const all=(dates||rangeDates());
  const active=subSettlementDates(s,all);
  let fee=0,award=0;
  const months=new Set();
  active.forEach(dt=>{const md=monthDaysOf(dt);months.add(ymOf(dt));fee+=(s.subFee||0)/md;award+=(s.award||0)/md;});
  let totalDays=all.length,denomLabel='';
  if(months.size===1&&active.length){totalDays=monthDaysOf(active[0]);denomLabel=active[0].getMonth()+1+'월 기준 '+active.length+'/'+totalDays+'일';}
  else if(months.size>1){denomLabel=Array.from(months).map(ym=>{const cnt=active.filter(d=>ymOf(d)===ym).length;const [y,m]=ym.split('-').map(Number);const md=new Date(y,m,0).getDate();return m+'월 '+cnt+'/'+md+'일';}).join(' + ');}
  else{denomLabel='0/'+totalDays+'일';}
  return{days:active.length,totalDays,fee:Math.round(fee),award:Math.round(award),dates:active,denomLabel};
}
function salaryProration(w,dates){
  const all=(dates&&dates.length)?dates:rangeDates();
  const [_y,_m]=S.month.split('-').map(Number);
  const monthDays=new Date(_y,_m,0).getDate();
  const active=all.filter(dt=>activeOn(w,iso(dt)));
  const gross=t10(Math.round((w.salary||0)*(active.length/monthDays)));
  const rate=(w.withhold!=null?w.withhold:3.3);
  const tax=t10(Math.round(gross*rate/100));
  const net=gross-tax;
  return{days:active.length,totalDays:monthDays,gross,tax,net,rate,label:active.length+'/'+monthDays+'일'};
}
function activeSubStoresForDates(dates){return allSubContracts().filter(s=>rangeOverlapsDates(s.contractStart,s.contractEnd,dates));}
function isOff(s,dt){return s.off && WDFULL[dt.getDay()]===s.off;}
function shortName(s){return s.name.replace('애슐리퀸즈 ','');}
function attKey(storeId,posKey,isoStr){return storeId+'#'+posKey+'#'+isoStr;}
function subKey(storeId,isoStr){return 'SUB#'+storeId+'#'+isoStr;}
function activeOn(w,ds){if(w.hireDate&&ds<w.hireDate)return false;if(w.resignDate&&ds>w.resignDate)return false;return true;}
function occupantOf(s,posKey,dt){const ds=iso(dt);let best=null;S.workers.forEach(w=>{if(w.type==='salary')return;if(w.storeId!==s.id||w.posKey!==posKey)return;if(!activeOn(w,ds))return;if(!best||((w.hireDate||'')>(best.hireDate||'')))best=w;});return best;}
function getAtt(s,posKey,dt){const k=attKey(s.id,posKey,iso(dt));const a=S.attendance[k];if(a)return a;if(isOff(s,dt))return{status:'off'};const occ=occupantOf(s,posKey,dt);if(occ)return{status:'work',workerId:occ.id,reg:defShiftH(),ot:0,auto:true};return{status:'plan',reg:defShiftH(),ot:0};}
function getSub(s,dt){const a=S.subatt[subKey(s.id,iso(dt))];if(a)return a;if(isOff(s,dt))return{status:'off'};return{status:'plan'};}
function rateFor(worker,posWage){return (worker&&worker.rate)?worker.rate:posWage;}

/* aggregate over period */
function workerAgg(DTS){DTS=DTS||periodDates();
  const map={}; S.workers.forEach(w=>map[w.id]={w,days:0,reg:0,ot:0,base:0,night:0,otpay:0,total:0,leaddays:0,byStore:{}});
  S.stores.forEach(s=>{
    positionsOf(s).forEach(p=>{ DTS.forEach(dt=>{
      const a=getAtt(s,p.key,dt);
      if(a.status!=='work'||!a.workerId)return; const m=map[a.workerId]; if(!m)return;
      if(m.w.type==='salary'||m.w.type==='personal'){ if(m.w.type==='salary')m.leaddays++; m.days++; (m.byStore[s.id]=m.byStore[s.id]||{d:0,t:0}).d++; return; }
      const pay=dayPay(rateFor(m.w,p.wage),a.reg,a.ot,m.w.noNight?0:attNight(a));
      m.days++; m.reg+=(a.reg||0); m.ot+=(a.ot||0); m.base+=pay.base; m.night+=pay.night; m.otpay+=pay.ot; m.total+=pay.total;
      const bs=(m.byStore[s.id]=m.byStore[s.id]||{d:0,t:0}); bs.d++; bs.t+=pay.total;
    });});
  });
  /* 그리드 포지션에 매칭되지 않는 posKey 직원도 매장 근무일 기준으로 자동 정산 (홀, 샐러드, 자재관리 등) */
  const _posWage=r=>r==='샐러드'||r==='샐러드바'?S.settings.wageSalad:S.settings.wageHK;
  S.stores.forEach(s=>{
    const gridKeys=positionsOf(s).map(p=>p.key);
    S.workers.filter(w=>w.posKey&&w.posKey!=='후보자'&&!gridKeys.includes(w.posKey)&&w.storeId===s.id&&(w.type==='hourly'||w.type==='personal')).forEach(w=>{
      const m=map[w.id];if(!m)return;
      if(w.type==='personal'){DTS.forEach(dt=>{const ds=iso(dt);if(!activeOn(w,ds))return;if(isOff(s,dt))return;m.days++;(m.byStore[s.id]=m.byStore[s.id]||{d:0,t:0}).d++;});return;}
      const wage=rateFor(w,_posWage(w.posKey));
      DTS.forEach(dt=>{const ds=iso(dt);if(!activeOn(w,ds))return;if(isOff(s,dt))return;
        const reg=defShiftH();const nightH=w.noNight?0:nightHours(S.settings.shiftStart,reg);
        const pay=dayPay(wage,reg,0,nightH);
        m.days++;m.reg+=reg;m.base+=pay.base;m.night+=pay.night;m.total+=pay.total;
        const bs=(m.byStore[s.id]=m.byStore[s.id]||{d:0,t:0});bs.d++;bs.t+=pay.total;
      });
    });
  });
  /* 패트롤 모드: patrolRegion 배정 직원 → 권역 내 모든 건물 근무일 기준 */
  if(isPatrol()){
    S.workers.filter(w=>w.patrolRegion).forEach(w=>{
      const m=map[w.id];if(!m)return;
      const rStores=regionStores(w.patrolRegion);if(!rStores.length)return;
      if(w.type==='salary'||w.type==='personal'){
        DTS.forEach(dt=>{if(!activeOn(w,iso(dt)))return;if(rStores.every(s=>isOff(s,dt)))return;m.days++;
          rStores.forEach(s=>{(m.byStore[s.id]=m.byStore[s.id]||{d:0,t:0}).d++;});});return;}
      const wage=rateFor(w,S.settings.wageHK);
      DTS.forEach(dt=>{if(!activeOn(w,iso(dt)))return;if(rStores.every(s=>isOff(s,dt)))return;
        const reg=defShiftH();const nightH=w.noNight?0:nightHours(S.settings.shiftStart,reg);
        const pay=dayPay(wage,reg,0,nightH);
        m.days++;m.reg+=reg;m.base+=pay.base;m.night+=pay.night;m.otpay+=pay.ot;m.total+=pay.total;
        const perStore=pay.total/rStores.length;
        rStores.forEach(s=>{const bs=(m.byStore[s.id]=m.byStore[s.id]||{d:0,t:0});bs.d++;bs.t+=perStore;});
      });
    });
  }
  return map;
}
function storeDirectCost(s,_D){let c=0;const DTS=_D||periodDates();positionsOf(s).forEach(p=>DTS.forEach(dt=>{const a=getAtt(s,p.key,dt);if(a.status==='work'&&a.workerId){const w=workerOf(a.workerId);if(w&&w.type==='hourly')c+=dayPay(rateFor(w,p.wage),a.reg,a.ot,w.noNight?0:attNight(a)).total;}}));
  const _pw=r=>r==='샐러드'||r==='샐러드바'?S.settings.wageSalad:S.settings.wageHK;const _gk=positionsOf(s).map(p=>p.key);
  S.workers.filter(w=>w.posKey&&w.posKey!=='후보자'&&!_gk.includes(w.posKey)&&w.storeId===s.id&&w.type==='hourly').forEach(w=>{const wage=rateFor(w,_pw(w.posKey));DTS.forEach(dt=>{if(!activeOn(w,iso(dt)))return;if(isOff(s,dt))return;const reg=defShiftH();c+=dayPay(wage,reg,0,w.noNight?0:nightHours(S.settings.shiftStart,reg)).total;});});
  return c;}
function storeIndex(s){return S.stores.findIndex(x=>x.id===s.id);}
function workerIndex(w){return S.workers.findIndex(x=>x.id===w.id);}
function sortStoresBy(list){const k=S.sortStore||'oldest';const a=list.slice();
  if(k==='name')a.sort((x,y)=>shortName(x).localeCompare(shortName(y),'ko'));
  else if(k==='status')a.sort((x,y)=>(x.mode===y.mode?(storeIndex(x)-storeIndex(y)):(x.mode==='sub'?1:-1)));
  else if(k==='newest')a.sort((x,y)=>storeIndex(y)-storeIndex(x));
  else a.sort((x,y)=>storeIndex(x)-storeIndex(y));
  return a;}
function workerSortAmount(w){
  if(w.type==='salary'||w.type==='personal')return w.salary||0;
  if(w.rate)return w.rate||0;
  const st=w.storeId?storeOf(w.storeId):null;
  if(st&&w.posKey){const p=positionsOf(st).find(x=>x.key===w.posKey);if(p)return p.wage||0;}
  return S.settings.wageHK||0;
}
function sortWorkers(list){const k=S.sortPeople||'store';const a=list.slice();const sn=w=>(w.storeId&&storeOf(w.storeId))?shortName(storeOf(w.storeId)):'\uffff';
  if(k==='store')a.sort((x,y)=>sn(x).localeCompare(sn(y),'ko')||x.name.localeCompare(y.name,'ko'));
  else if(k==='status')a.sort((x,y)=>((x.resignDate?1:0)-(y.resignDate?1:0))||x.name.localeCompare(y.name,'ko'));
  else if(k==='newest')a.sort((x,y)=>workerIndex(y)-workerIndex(x));
  else if(k==='nameAsc')a.sort((x,y)=>x.name.localeCompare(y.name,'ko'));
  else if(k==='nameDesc')a.sort((x,y)=>y.name.localeCompare(x.name,'ko'));
  else if(k==='amountDesc')a.sort((x,y)=>workerSortAmount(y)-workerSortAmount(x)||x.name.localeCompare(y.name,'ko'));
  else if(k==='amountAsc')a.sort((x,y)=>workerSortAmount(x)-workerSortAmount(y)||x.name.localeCompare(y.name,'ko'));
  else a.sort((x,y)=>workerIndex(x)-workerIndex(y));
  return a;}
function sortSubsBy(list){const k=S.sortSub||'region';const a=list.slice();
  if(k==='region')a.sort((x,y)=>(x.region||'').localeCompare(y.region||'','ko')||shortName(x).localeCompare(shortName(y),'ko'));
  else if(k==='newest')a.sort((x,y)=>storeIndex(y)-storeIndex(x));
  else if(k==='amount')a.sort((x,y)=>(y.subFee||0)-(x.subFee||0));
  else if(k==='vendor')a.sort((x,y)=>(x.subVendor||'\uffff').localeCompare(y.subVendor||'\uffff','ko'));
  return a;}
function selBox(fn,cur,o){return `<select onchange="${fn}(this.value)" style="font-size:12px;padding:5px 8px;width:auto">${o.map(x=>`<option value="${x[0]}" ${cur===x[0]?'selected':''}>정렬: ${x[1]}</option>`).join('')}</select>`;}
function storeSortControl(){return selBox('setStoreSort',S.sortStore||'oldest',[['oldest','오래된순'],['newest','최신순'],['name','지점순'],['status','상태순']]);}
function peopleSortControl(){return selBox('setPeopleSort',S.sortPeople||'store',[['store','지점순'],['nameAsc','이름순'],['nameDesc','이름역순'],['amountDesc','금액높은순'],['amountAsc','금액낮은순'],['status','상태순'],['newest','최신순'],['oldest','오래된순']]);}
function albaPaySortControl(){return selBox('setAlbaPaySort',S.albaPaySort||'default',[['default','기본순'],['nameAsc','이름순'],['nameDesc','이름역순'],['amountDesc','지급액높은순'],['amountAsc','지급액낮은순'],['netDesc','실지급높은순'],['netAsc','실지급낮은순']]);}
function subSortControl(){return selBox('setSubSort',S.sortSub||'region',[['region','지역순'],['newest','최신순'],['amount','금액순'],['vendor','업체순']]);}
function setStoreSort(v){S.sortStore=v;save();render();}
function setPeopleSort(v){S.sortPeople=v;save();render();}
function setAlbaPaySort(v){S.albaPaySort=v;save();render();}
function setSubSort(v){S.sortSub=v;save();render();}
function storeNoShows(s,_D){let n=0;if(isSub(s)){(_D||periodDates()).forEach(dt=>{if(getSub(s,dt).status==='undone')n++;});return n;}positionsOf(s).forEach(p=>(_D||periodDates()).forEach(dt=>{if(getAtt(s,p.key,dt).status==='noshow')n++;}));return n;}
function storePeople(s,_D){const set=new Set();positionsOf(s).forEach(p=>(_D||periodDates()).forEach(dt=>{const a=getAtt(s,p.key,dt);if(a.status==='work'&&a.workerId)set.add(a.workerId);}));return set.size;}
function posRoster(s,posKey){const map={};periodDates().forEach(dt=>{const a=getAtt(s,posKey,dt);if(a.status==='work'&&a.workerId)map[a.workerId]=(map[a.workerId]||0)+1;});return Object.keys(map).map(id=>({w:workerOf(id),days:map[id]})).filter(x=>x.w).sort((a,b)=>b.days-a.days);}
function storeLeadDays(s,_D){let n=0;positionsOf(s).forEach(p=>(_D||periodDates()).forEach(dt=>{const a=getAtt(s,p.key,dt);if(a.status==='work'&&a.workerId){const w=workerOf(a.workerId);if(w&&w.type==='salary')n++;}}));return n;}
function subAgg(s,_D){let done=0,planned=0;subSettlementDates(s,(_D||periodDates())).forEach(dt=>{if(isOff(s,dt))return;planned++;if(getSub(s,dt).status==='done')done++;});return{done,planned};}

function banner(){return `<div class="pbanner">📅 정산기간 <span class="num">${periodLabel()}</span> · ${S.month.split('-')[1]}월 급여마감(${S.settings.cutoffDay}일) 기준</div>`;}

/* ===== 패트롤 대시보드 (건물관리/다락) ===== */
function renderDashPatrol(){
  const _RD=rangeDates();const agg=workerAgg(_RD);
  const regions=[...new Set(S.stores.map(s=>s.region).filter(Boolean))].sort();
  const patrolWorkers=S.workers.filter(w=>w.patrolRegion&&!w.resignDate);
  const allWorkers=S.workers.filter(w=>w.patrolRegion);
  let tAward=0,tBudget=0,tCost=0;
  regions.forEach(r=>{const ss=regionStores(r);tAward+=ss.reduce((a,s)=>a+(s.award||0),0);tBudget+=ss.reduce((a,s)=>a+(s.laborBudget||s.subFee||0),0);});
  allWorkers.forEach(w=>{const m=agg[w.id];tCost+=w.type==='hourly'?m.total:(w.salary||0);});
  const tMargin=tAward-tCost;const mRate=tAward?Math.round(tMargin/tAward*100):0;

  const _pr=S.payRange||{preset:'cycle'};

    <div class="row" style="margin-top:8px;${_pr.preset==='custom'?'':'display:none'}"><div style="flex:1"><label class="fld">시작일</label><input type="date" id="pr_s" value="${_pr.start||iso(_RD[0]||new Date())}"></div>
      <div style="flex:1"><label class="fld">종료일</label><input type="date" id="pr_e" value="${_pr.end||iso((_RD[_RD.length-1])||new Date())}"></div>
      <button class="btn pri" onclick="applyCustom()">적용</button></div>
    <div style="margin-top:6px;font-size:12.5px;color:var(--purple);font-weight:700">\uD83D\uDCC5 ${rangeLabel()} \u00B7 ${_RD.length}일</div></div></div>`;

  /* ── 지도 ── */

  if(hasCoords){
    h+=`<div class="panel" style="margin-bottom:16px"><div class="phead"><h2>\uD83D\uDDFA\uFE0F 건물 지도</h2><span class="hint">${S.stores.filter(s=>s.lat&&s.lng).length}/${S.stores.length}개 건물 표시</span></div><div class="pbody" style="padding:0;overflow:hidden;border-radius:0 0 14px 14px"><div id="patrolMap" style="height:420px;width:100%"></div></div></div>`;
  }

  /* ── 히어로 지표 ── */
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px">
    <div style="background:linear-gradient(135deg,${wsColor()},${wsColor()}cc);border-radius:14px;padding:20px;color:#fff;text-align:center"><div style="font-size:32px;font-weight:900">${regions.length}</div><div style="font-size:12px;opacity:.85;margin-top:2px">운영 권역</div></div>
    <div style="background:linear-gradient(135deg,#6366f1,#818cf8);border-radius:14px;padding:20px;color:#fff;text-align:center"><div style="font-size:32px;font-weight:900">${S.stores.length}</div><div style="font-size:12px;opacity:.85;margin-top:2px">관리 건물</div></div>
    <div style="background:linear-gradient(135deg,#0ea5e9,#38bdf8);border-radius:14px;padding:20px;color:#fff;text-align:center"><div style="font-size:32px;font-weight:900">${patrolWorkers.length}</div><div style="font-size:12px;opacity:.85;margin-top:2px">패트롤 인력</div></div>
    <div style="background:linear-gradient(135deg,${tMargin>=0?'#10b981,#34d399':'#ef4444,#f87171'});border-radius:14px;padding:20px;color:#fff;text-align:center"><div style="font-size:24px;font-weight:900">${mRate}%</div><div style="font-size:12px;opacity:.85;margin-top:2px">마진율 · ${won(tMargin)}</div></div>
  </div>`;

  /* ── 수주/원가 요약 ── */
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px">

  </div>`;

      bounds.push([s.lat,s.lng]);

    legend.addTo(map);

}

function normSearch(v){return String(v||'').toLowerCase().replace(/\s+/g,'');}
function safeVal(v){return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function storeSearchText(s){return normSearch([s.name,shortName(s),s.region,s.sido,s.addr,s.mgr,s.mgrPhone,s.subVendor,s.subContact,s.mode==='sub'?'도급':'직영'].join(' '));}
function workerSearchText(w){const st=w.storeId?storeOf(w.storeId):null;return normSearch([w.name,w.phone,w.memo,w.posKey,w.bankName,w.bankAccount,w.bankHolder,w.type==='hourly'?'알바 시급':(w.type==='salary'?'팀장 월급':'개인 월급'),st?st.name:'',st?shortName(st):''].join(' '));}
let SEARCH_T=null;
function setSearch(k,v,immediate){
  S[k]=v||'';
  store.set(wsKey(),JSON.stringify(S));
  clearTimeout(SEARCH_T);
  SEARCH_T=setTimeout(()=>{save();render();},immediate?0:700);
}
function handleSearchInput(k,el){
  S[k]=el.value||'';
  store.set(wsKey(),JSON.stringify(S));
  if(el.dataset.composing==='1')return;
  clearTimeout(SEARCH_T);
  SEARCH_T=setTimeout(()=>{save();render();},700);
}
function clearSearch(k){S[k]='';save();render();}
function searchBox(key,placeholder){const v=safeVal(S[key]||'');return `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px"><input value="${v}" oncompositionstart="this.dataset.composing='1'" oncompositionend="this.dataset.composing='0';setSearch('${key}',this.value,true)" oninput="handleSearchInput('${key}',this)" onkeydown="if(event.key==='Enter'){event.preventDefault();setSearch('${key}',this.value,true);}" placeholder="${placeholder}" style="max-width:320px;min-width:210px"><button class="btn ghost sm" onclick="clearSearch('${key}')">초기화</button></div>`;}
function sortAlbaPayWorkers(list,agg){const k=S.albaPaySort||'default';const a=list.slice();const taxOf=w=>{const m=agg[w.id]||{total:0};return t10(m.total*((w.withhold!=null?w.withhold:3.3)/100));};
  if(k==='nameAsc')a.sort((x,y)=>x.name.localeCompare(y.name,'ko'));
  else if(k==='nameDesc')a.sort((x,y)=>y.name.localeCompare(x.name,'ko'));
  else if(k==='amountDesc')a.sort((x,y)=>((agg[y.id]||{}).total||0)-((agg[x.id]||{}).total||0)||x.name.localeCompare(y.name,'ko'));
  else if(k==='amountAsc')a.sort((x,y)=>((agg[x.id]||{}).total||0)-((agg[y.id]||{}).total||0)||x.name.localeCompare(y.name,'ko'));
  else if(k==='netDesc')a.sort((x,y)=>((((agg[y.id]||{}).total||0)-taxOf(y))-(((agg[x.id]||{}).total||0)-taxOf(x)))||x.name.localeCompare(y.name,'ko'));
  else if(k==='netAsc')a.sort((x,y)=>((((agg[x.id]||{}).total||0)-taxOf(x))-(((agg[y.id]||{}).total||0)-taxOf(y)))||x.name.localeCompare(y.name,'ko'));
  return a;}

function docChip(w,key,label){const on=w.docs&&w.docs[key];return `<span onclick="toggleDoc('${w.id}','${key}')" title="${label} ${on?'완료':'미수령'}" style="cursor:pointer;display:inline-block;padding:2px 7px;border-radius:14px;font-size:10px;font-weight:700;margin:1px;background:${on?'var(--green-l)':'#eef1f5'};color:${on?'var(--green)':'#9aa4b0'}">${on?'✓':'·'} ${label}</span>`;}
function toggleDoc(id,key){const w=workerOf(id);w.docs=w.docs||{};w.docs[key]=!w.docs[key];save();renderPeople();}
function payKey(wid,month){return wid+'|'+(month||S.month);} // 사람별 + 정산월별 지급상태
function payDateForMonth(month){const [y,m]=(month||S.month).split('-').map(Number);return y+'-'+String(m).padStart(2,'0')+'-25';}
function setPayMonth(month){if(!month)return;S.month=month;const mp=document.getElementById('monthPick');if(mp)mp.value=month;if((S.payRange||{}).preset==='custom')S.payRange={preset:'cycle'};save();render();}
function movePayMonth(delta){const [y,m]=S.month.split('-').map(Number);const d=new Date(y,m-1+delta,1);setPayMonth(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));}
function getPay(wid,month){return (S.pay||{})[payKey(wid,month)];}
function setPaid(wid,date){const k=payKey(wid);S.pay=S.pay||{};if(date){S.pay[k]={paid:true,date:date};}else{delete S.pay[k];}}
function togglePay(wid){const ps=getPay(wid);if(ps&&ps.paid){setPaid(wid,'');}else{setPaid(wid,payDateForMonth(S.month));}save();render();}
function setPayDate(wid,d){setPaid(wid,d);save();render();}
function setPayFilter(v){S.payFilter=v;save();render();}
function markAllHourlyPaid(){const agg=workerAgg(rangeDates());S.workers.filter(w=>w.type==='hourly'&&agg[w.id]&&agg[w.id].days>0).forEach(w=>setPaid(w.id,payDateForMonth(S.month)));save();render();}
function clearAllHourlyPaid(){const agg=workerAgg(rangeDates());S.workers.filter(w=>w.type==='hourly'&&agg[w.id]&&agg[w.id].days>0).forEach(w=>setPaid(w.id,''));save();render();}
function subPayKey(contractId,month){return 'SUBPAY|'+contractId+'|'+(month||S.month);}
function getSubPay(contractId,month){return (S.subPay||{})[subPayKey(contractId,month)];}
function setSubPaid(contractId,date){const k=subPayKey(contractId);S.subPay=S.subPay||{};if(date){S.subPay[k]={paid:true,date:date};}else{delete S.subPay[k];}}
function toggleSubPay(contractId){const ps=getSubPay(contractId);if(ps&&ps.paid){setSubPaid(contractId,'');}else{setSubPaid(contractId,payDateForMonth(S.month));}save();render();}
function setSubPayDate(contractId,d){setSubPaid(contractId,d);save();render();}
function setSubPayFilter(v){S.subPayFilter=v;save();render();}
function markAllSubPaid(){activeSubStoresForDates(rangeDates()).forEach(s=>setSubPaid(s.id,payDateForMonth(S.month)));save();render();}
function clearAllSubPaid(){activeSubStoresForDates(rangeDates()).forEach(s=>setSubPaid(s.id,''));save();render();}

      <td class="c"><span class="tag ${w.type==='hourly'?'b':'p'}">${w.type==='hourly'?'알바(시급)':(w.type==='salary'?'월급(팀장)':'개인(월급)')}</span></td>

function renderSched(){

  DTS.forEach(dt=>{const wd=dt.getDay();const cls=wd===0?'we':(wd===6?'sa':'');head+=`<th class="c"><div class="dhead ${cls}"><span class="mo">${dt.getMonth()+1}/</span>${dt.getDate()}</div><div class="dhead ${cls}" style="font-size:9px">${WD[wd]}</div></th>`;});
  let body='';

    const sub=isSub(s);
    body+=`<tr class="storerow ${sub?'sub':'dir'}"><td colspan="${DTS.length+1}" style="padding:0"><div class="store-label" style="position:sticky;left:0;z-index:4;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:0 8px 8px 0;background:${sub?'#e2f3f4':'var(--blue-l)'}">${sub?'[도급] ':'[직영] '}${shortName(s)} · ${s.region} · 휴무 ${s.off||'-'}${s.note?' · ⚑ '+s.note:''}</div></td></tr>`;

      body+=`<tr><td class="who">${s.subVendor||'도급업체'}<div style="font-size:10px;color:var(--mut)">월 도급비 ${won(s.subFee)}</div></td>`;
      DTS.forEach(dt=>{const a=getSub(s,dt);let cls='dc-plan',lab='·';if(a.status==='off'){cls='dc-off';lab=a.reason?'휴*':'휴';}else if(a.status==='done'){cls='dc-done';lab='O';}else if(a.status==='undone'){cls='dc-noshow';lab='X';}
        body+=`<td class="daycell ${cls}" onclick="openSub('${s.id}','${iso(dt)}')">${lab}</td>`;});

        body+=`<tr><td class="who">${p.key} <span style="font-size:10px;color:var(--mut)">${won(p.wage)}/h</span>${rosterHtml}</td>`;
        DTS.forEach(dt=>{const a=getAtt(s,p.key,dt);let cls='dc-plan',inner='·',ttl='';
          if(a.status==='off'){cls='dc-off';inner=a.reason?`휴<div class="hh">${a.reason}</div>`:'휴';ttl=a.reason?'휴무 · '+a.reason:'휴무';}
          else if(a.status==='noshow'){const w=workerOf(a.workerId);cls='dc-noshow';inner=`<span class="nm">${w?w.name:''}</span><span class="hh" style="color:var(--red);font-weight:700">노쇼</span>`;ttl='노쇼'+(w?' · '+w.name:'');}
          else if(a.status==='work'){const w=workerOf(a.workerId);const lead=w&&w.type==='salary';cls=lead?'dc-lead':(a.auto?'dc-work dc-auto':'dc-work');if(w&&w.resignDate)cls+=' dc-resigned';const nh=attNight(a);
            ttl=(w?w.name:'?')+' · '+hmLabel(a.reg)+(a.ot?' (+'+hmLabel(a.ot)+')':'')+(nh===0?' · 주간':' · 심야 '+hmLabel(nh))+(a.auto?' · 자동(인력풀)':'');
            inner=`<span class="nm">${w?w.name:'?'}</span><span class="hh">${hmLabel(a.reg)}${nh===0?' 주':''}</span>${a.ot?`<span class="ot">+${hmLabel(a.ot)}</span>`:''}`;}
          body+=`<td class="daycell ${cls}" title="${ttl}" onclick="openCell('${s.id}','${p.key}','${iso(dt)}')">${inner}</td>`;});

      <span><i class="sw" style="background:repeating-linear-gradient(45deg,#f1f3f7,#f1f3f7 3px,#e8ebf0 3px,#e8ebf0 6px)"></i> 휴무</span>
      <span style="color:var(--amber)"><b>+n</b> 초과</span><span><b style="color:var(--blue-d)">주</b> 주간(심야 미적용)</span></div>`; }
  h+=`</div></div>`;
  document.getElementById('sched').innerHTML=h;
}
function weekDates(){let base=S.weekStart?new Date(S.weekStart+'T00:00:00'):new Date();if(isNaN(base))base=new Date();const d=new Date(base);const day=d.getDay();const diff=(day===0?-6:1-day);d.setDate(d.getDate()+diff);const out=[];for(let i=0;i<7;i++){const x=new Date(d);x.setDate(d.getDate()+i);out.push(x);}return out;}
function setSchedView(v){S.schedView=v;if(v==='week'&&!S.weekStart){const pd=periodDates();S.weekStart=iso(pd[0]||new Date());}save();renderSched();}
function weekNav(delta){const wd=weekDates();const base=new Date(wd[0]);base.setDate(base.getDate()+delta*7);S.weekStart=iso(base);save();renderSched();}
function weekThis(){S.weekStart=iso(new Date());save();renderSched();}

  let cards='';
  days.forEach(dt=>{const wd=dt.getDay();const we=wd===0||wd===6;let items='';
    sortStoresBy(S.stores).forEach(s=>{
      if(isSub(s)){const a=getSub(s,dt);if(a.status==='done'||a.status==='undone'){const ok=a.status==='done';items+=`<div onclick="openSub('${s.id}','${iso(dt)}')" style="cursor:pointer;background:${ok?'var(--teal-l)':'var(--red-l)'};color:${ok?'var(--teal)':'var(--red)'};border-radius:7px;padding:5px 7px;margin-bottom:4px;font-size:11.5px"><b>${shortName(s)}</b> · 도급 ${ok?'완료':'미완료'}</div>`;}}
      else{positionsOf(s).forEach(p=>{const a=getAtt(s,p.key,dt);
        if(a.status==='work'){const w=workerOf(a.workerId);const lead=w&&w.type==='salary';const nh=attNight(a);
          items+=`<div onclick="openCell('${s.id}','${p.key}','${iso(dt)}')" style="cursor:pointer;background:${lead?'var(--purple-l)':'var(--blue-l)'};color:${lead?'var(--purple)':'var(--blue-d)'};border-radius:7px;padding:5px 7px;margin-bottom:4px;font-size:11.5px"><b>${w?w.name:'?'}</b> · ${shortName(s)} ${p.key} · ${hmLabel(a.reg)}${a.ot?'(+'+hmLabel(a.ot)+')':''}${nh===0?' 주간':''}</div>`;}
        else if(a.status==='noshow'){const w=workerOf(a.workerId);items+=`<div onclick="openCell('${s.id}','${p.key}','${iso(dt)}')" style="cursor:pointer;background:var(--red-l);color:var(--red);border-radius:7px;padding:5px 7px;margin-bottom:4px;font-size:11.5px"><b>노쇼${w?' '+w.name:''}</b> · ${shortName(s)} ${p.key}</div>`;}
      });}
    });
    if(!items)items=`<div style="font-size:11px;color:#c2cad4;text-align:center;padding:10px 0">근무 없음</div>`;
    cards+=`<div style="flex:1 1 150px;min-width:148px;border:1px solid var(--line);border-radius:10px;overflow:hidden">
      <div style="background:${we?'#fbeef0':'#eef4fc'};color:${we?'var(--red)':'var(--blue-d)'};padding:7px;text-align:center;font-weight:700;font-size:12.5px">${dt.getMonth()+1}/${dt.getDate()} (${WD[wd]})</div>
      <div style="padding:7px;min-height:60px">${items}</div></div>`;});
  return nav+`<div style="display:flex;gap:8px;flex-wrap:wrap">${cards}</div>`;
}

    <div class="grid2" style="margin-top:10px">
      <div><label class="fld">지급 총액</label><input type="number" id="mp_amount" value="${item.amount||0}"></div>
      <div><label class="fld">원천징수율 (%)</label><input type="number" step="0.1" id="mp_tax" value="${item.taxRate!=null?item.taxRate:3.3}"></div>

  document.getElementById('modal').classList.add('on');
}
function addManualPay(){manualPayModal({},true);}
function editManualPay(id){const item=(S.manualPay||[]).find(x=>x.id===id);if(item)manualPayModal(item,false);}
function saveManualPay(id){
  const d={name:document.getElementById('mp_name').value.trim()||'이름없음',amount:parseInt(document.getElementById('mp_amount').value)||0,taxRate:parseFloat(document.getElementById('mp_tax').value)||0,date:document.getElementById('mp_date').value||'',month:document.getElementById('mp_month').value||S.month,memo:document.getElementById('mp_memo').value};
  S.manualPay=S.manualPay||[];
  if(id==='NEW'){d.id='MP'+Date.now();S.manualPay.push(d);}
  else{const item=S.manualPay.find(x=>x.id===id);if(item)Object.assign(item,d);}
  save();closeModal();render();
}
function delManualPay(id){if(!confirm('이 항목을 삭제할까요?'))return;S.manualPay=(S.manualPay||[]).filter(x=>x.id!==id);save();render();}

  // alba settlement

  if(!sal.length)h+=`<tr><td colspan="8" class="c" style="color:var(--mut);padding:18px">등록된 개인 월급제가 없습니다.</td></tr>`;

function readHM(idH,idM){const h=parseInt(document.getElementById(idH).value)||0;const m=parseInt(document.getElementById(idM).value)||0;return h+m/60;}
function cellPreview(){if(CUR.status!=='work')return;const wid=document.getElementById('f_worker').value;const w=workerOf(wid);

function quickAddWorker(){const n=prompt('새 알바 이름을 입력하세요');if(!n)return;const w={id:'ST'+Date.now(),name:n.trim(),type:'hourly',salary:0,withhold:3.3,rate:null,phone:'',memo:''};S.workers.push(w);save();const sel=document.getElementById('f_worker');sel.innerHTML=workerOptions(w.id);cellPreview();}
function applyOne(isoStr){
  const k=attKey(CUR.storeId,CUR.posKey,isoStr);
  if(CUR.status==='work'){const wid=document.getElementById('f_worker').value;if(!wid){alert('근무자를 선택하세요.');return false;}
    const nReg=readHM('f_nRegH','f_nRegM'),nOt=readHM('f_nOtH','f_nOtM');
    S.attendance[k]={status:'work',workerId:wid,reg:readHM('f_dRegH','f_dRegM')+nReg,ot:readHM('f_dOtH','f_dOtM')+nOt,nReg,nOt};}
  else if(CUR.status==='noshow'){const we=document.getElementById('f_worker');S.attendance[k]={status:'noshow',workerId:(we&&we.value)||''};}

function saveCell(bulk){
  if(!bulk){ if(!applyOne(CUR.isoStr))return; }
  else{
    const wds=Object.keys(SELWD).filter(k=>SELWD[k]).map(Number);
    if(!wds.length){alert('적용할 요일을 선택하세요.');return;}
    if(CUR.status==='work'&&!document.getElementById('f_worker').value){alert('근무자를 선택하세요.');return;}
    const s=storeOf(CUR.storeId);
    const _w=document.getElementById('f_worker').value,_nReg=readHM('f_nRegH','f_nRegM'),_nOt=readHM('f_nOtH','f_nOtM'),_r=readHM('f_dRegH','f_dRegM')+_nReg,_o=readHM('f_dOtH','f_dOtM')+_nOt,_reason=(document.getElementById('f_reason')&&document.getElementById('f_reason').value.trim())||'';
    periodDates().forEach(dt=>{ if(!wds.includes(dt.getDay()))return; if(isOff(s,dt))return;
      const k=attKey(CUR.storeId,CUR.posKey,iso(dt));
      if(CUR.status==='work')S.attendance[k]={status:'work',workerId:_w,reg:_r,ot:_o,nReg:_nReg,nOt:_nOt};
      else if(CUR.status==='noshow')S.attendance[k]={status:'noshow',workerId:_w};
      else if(CUR.status==='off')S.attendance[k]={status:'off',reason:_reason};
      else S.attendance[k]={status:CUR.status};
    });
  }
  save();closeModal();render();
}

function bulkTargetDates(s){const wds=Object.keys(SELWD).filter(k=>SELWD[k]).map(Number);return periodDates().filter(dt=>!isOff(s,dt)&&(wds.length===0||wds.includes(dt.getDay())));}
function saveStoreBulk(){const s=storeOf(CUR.storeId);const ps=positionsOf(s);const dts=bulkTargetDates(s);let cnt=0;
  ps.forEach((p,i)=>{const wid=document.getElementById('b_w'+i).value;if(!wid)return;
    const reg=readHM('b_rh'+i,'b_rm'+i),ot=readHM('b_oh'+i,'b_om'+i),nOn=document.getElementById('b_n'+i).checked;
    dts.forEach(dt=>{S.attendance[attKey(s.id,p.key,iso(dt))]={status:'work',workerId:wid,reg,ot,noNight:!nOn};cnt++;});});
  if(!cnt){alert('근무자를 한 자리 이상 선택하세요.');return;}
  save();closeModal();render();}
function bulkResetStore(){const s=storeOf(CUR.storeId);const ps=positionsOf(s);const dts=bulkTargetDates(s);
  if(!dts.length){alert('대상 날짜가 없습니다.');return;}
  if(!confirm(`${shortName(s)} · ${dts.length}일을 예정으로 초기화할까요? (입력값 삭제)`))return;
  ps.forEach(p=>dts.forEach(dt=>{delete S.attendance[attKey(s.id,p.key,iso(dt))];}));
  save();closeModal();render();}

function assignPos(storeId,posKey,workerId){if(!workerId)return;const s=storeOf(storeId);const w=workerOf(workerId);
  const dts=periodDates().filter(dt=>!isOff(s,dt));
  if(!confirm(`${shortName(s)} · ${posKey} 자리를 기간 전체(${dts.length}일)를 ${w.name}(으)로 채울까요?\n휴무일 제외 · 기존 입력 덮어씀 · 이후 특정 날짜는 셀 클릭으로 다른 사람 지정 가능`))return;
  dts.forEach(dt=>{S.attendance[attKey(s.id,posKey,iso(dt))]={status:'work',workerId,reg:defShiftH(),ot:0,noNight:false};});
  save();render();}

function toggleMode(){const m=document.getElementById('e_mode').value;document.getElementById('dirFields').style.display=m==='sub'?'none':'';document.getElementById('subFields').style.display=m==='sub'?'':'none';}
function addStore(){storeForm({mode:'direct',headcount:2,shiftH:2,active:true},true);}
function editStore(id){storeForm(storeOf(id),false);}
function saveStore(id){const mode=document.getElementById('e_mode').value;
  const old=id==='NEW'?null:storeOf(id);
  const d={name:document.getElementById('e_name').value.trim()||'신규 매장',mode,region:document.getElementById('e_region').value.trim(),off:document.getElementById('e_off').value||null,award:parseInt(document.getElementById('e_aw').value)||0,note:document.getElementById('e_note').value,mgr:document.getElementById('e_mgr').value,mgrPhone:document.getElementById('e_mgrp').value,active:document.getElementById('e_active').checked,lat:parseFloat(document.getElementById('e_lat').value)||null,lng:parseFloat(document.getElementById('e_lng').value)||null};
  d.subContracts=(old&&Array.isArray(old.subContracts))?old.subContracts.slice():[];
  const hcEl=document.getElementById('hist_count');
  if(hcEl&&old&&Array.isArray(old.subContracts)){
    const nextHist=[];
    for(let i=0;i<parseInt(hcEl.value||'0');i++){
      const prev={...(old.subContracts[i]||{})};
      const del=document.getElementById('hist_del_'+i); if(del&&del.checked)continue;
      const gv=id=>{const el=document.getElementById(id+'_'+i);return el?el.value:''};
      prev.subVendor=gv('hist_sv'); prev.subFee=parseInt(gv('hist_sf'))||0; prev.contractStart=gv('hist_cs'); prev.contractEnd=gv('hist_ce'); prev.subContact=gv('hist_sc');
      prev.bankName=gv('hist_bn'); prev.bankAccount=gv('hist_ba'); prev.bankHolder=gv('hist_bh');
      if(!prev.id)prev.id='SUBC_'+(old.id||'STORE')+'_'+Date.now()+'_'+i;
      nextHist.push(prev);
    }
    d.subContracts=nextHist;
  }
  function archiveOldSub(){
    if(!old||!isSub(old))return;
    if(!(old.subVendor||old.subFee||old.contractStart||old.contractEnd))return;
    const hist={id:'SUBC_'+old.id+'_'+Date.now(),subVendor:old.subVendor||'',subFee:old.subFee||0,subContact:old.subContact||'',contractStart:old.contractStart||'',contractEnd:old.contractEnd||'',bizName:old.bizName||'',bizNo:old.bizNo||'',bizOwner:old.bizOwner||'',bizType:old.bizType||'',bizItem:old.bizItem||'',bizAddr:old.bizAddr||'',bizEmail:old.bizEmail||'',bankName:old.bankName||'',bankAccount:old.bankAccount||'',bankHolder:old.bankHolder||''};
    const dup=d.subContracts.some(c=>(c.subVendor||'')===hist.subVendor&&(c.contractStart||'')===hist.contractStart&&(c.contractEnd||'')===hist.contractEnd&&(c.subFee||0)===hist.subFee);
    if(!dup)d.subContracts.push(hist);
  }
  if(mode==='sub'){
    d.subVendor=document.getElementById('e_sv').value;d.subFee=parseInt(document.getElementById('e_sf').value)||0;d.subContact=document.getElementById('e_sc').value;d.contractStart=document.getElementById('e_cstart').value||'';d.contractEnd=document.getElementById('e_cend').value||'';d.bizName=document.getElementById('e_bizname').value;d.bizNo=document.getElementById('e_bizno').value;d.bizOwner=document.getElementById('e_bizowner').value;d.bizType=document.getElementById('e_biztype').value;d.bizItem=document.getElementById('e_bizitem').value;d.bizAddr=document.getElementById('e_bizaddr').value;d.bizEmail=document.getElementById('e_bizemail').value;d.bankName=document.getElementById('e_bankname').value;d.bankAccount=document.getElementById('e_bankacct').value;d.bankHolder=document.getElementById('e_bankholder').value;d.laborBudget=0;
  }
  else{
    archiveOldSub();
    d.headcount=parseInt(document.getElementById('e_hc').value)||2;d.shiftH=defShiftH();d.laborBudget=parseInt(document.getElementById('e_lb').value)||0;d.subFee=0;d.subVendor='';d.subContact='';d.contractStart='';d.contractEnd='';
  }
  if(id==='NEW')S.stores.push({id:'S'+Date.now(),...d,contacts:[]});else Object.assign(storeOf(id),d);
  save();closeModal();render();}
function delStore(id){const s=storeOf(id);if(!confirm(shortName(s)+' 매장을 삭제할까요? 기록도 함께 삭제됩니다.'))return;
  S.stores=S.stores.filter(x=>x.id!==id);
  Object.keys(S.attendance).forEach(k=>{if(k.startsWith(id+'#'))delete S.attendance[k];});
  Object.keys(S.subatt).forEach(k=>{if(k.startsWith('SUB#'+id+'#'))delete S.subatt[k];});
  save();render();}

    <div class="grid2" style="margin-top:10px"><div><label class="fld">구분</label><select id="w_type" onchange="toggleWType()"><option value="hourly" ${w.type==='hourly'?'selected':''}>알바(시급)</option><option value="salary" ${w.type==='salary'?'selected':''}>본사 팀장(월급)</option><option value="personal" ${w.type==='personal'?'selected':''}>개인(월급)</option></select></div>
      <div><label class="fld">${_patrolMode?'담당 권역':'소속 지점'}</label>${_patrolMode?`<select id="w_region">${regionOptions(w.patrolRegion||'')}</select><input type="hidden" id="w_store" value="${w.storeId||''}">`:`<select id="w_store" onchange="refreshWPos()"><option value="">미지정</option>${storeOpts}</select>`}</div></div>
    <div id="wPosWrap" style="margin-top:10px;${(sal||_patrolMode)?'display:none':''}"><label class="fld">담당 자리 <span style="font-weight:400;color:var(--mut)">(지정 시 입사~퇴사 기간 동안 스케줄 자동 반영)</span></label><select id="w_pos">${posOptionsFor(w.storeId,w.posKey)}</select></div>
    <div class="grid2" style="margin-top:10px"><div><label class="fld">연락처</label><input id="w_phone" value="${(w.phone||'').replace(/"/g,'&quot;')}"></div>
      <div><label class="fld">입사일</label><input type="date" id="w_hire" value="${w.hireDate||''}"></div></div>
    <div class="grid2" style="margin-top:10px"><div><label class="fld">은행명</label><input id="w_bank" value="${(w.bankName||'').replace(/"/g,'&quot;')}" placeholder="예: 국민은행"></div>
      <div><label class="fld">계좌번호</label><input id="w_acct" value="${(w.bankAccount||'').replace(/"/g,'&quot;')}" placeholder="숫자/하이픈 가능"></div>
      <div><label class="fld">예금주</label><input id="w_holder" value="${(w.bankHolder||'').replace(/"/g,'&quot;')}" placeholder="예금주명"></div></div>
    <label class="fld" style="margin-top:10px">퇴사일 <span style="font-weight:400;color:var(--mut)">(입력 시 배정 목록에서 자동 제외)</span></label><input type="date" id="w_resign" value="${w.resignDate||''}">
    <div id="wHourly" style="${isM?'display:none':''}"><label class="fld" style="margin-top:10px">개별 시급 (비우면 자리 시급 적용)</label><input type="number" id="w_rate" value="${w.rate||''}" placeholder="자리 시급 따름">
      <label style="display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer;padding:10px 14px;border-radius:10px;background:${w.noNight?'#fceaed':'#f7f9fc'};border:1px solid ${w.noNight?'var(--red)':'#e3e8ef'}">
        <input type="checkbox" id="w_nonight" ${w.noNight?'checked':''} style="width:18px;height:18px;accent-color:var(--red)">
        <span style="font-size:13px;font-weight:600;color:${w.noNight?'var(--red)':'var(--mut)'}">심야수당 미적용 <span style="font-weight:400;font-size:11px">(체크 시 심야 50% 가산 제외)</span></span></label></div>
    <div id="wSalary" style="${isM?'':'display:none'}"><div class="grid2" style="margin-top:10px"><div><label class="fld">월 급여</label><input type="number" id="w_salary" value="${w.salary||3500000}"></div>
      <div><label class="fld">원천징수율 (%)</label><input type="number" step="0.1" id="w_with" value="${w.withhold!=null?w.withhold:3.3}"></div></div></div>
    <label class="fld" style="margin-top:10px">메모</label><input id="w_memo" value="${(w.memo||'').replace(/"/g,'&quot;')}">
    <div style="display:flex;gap:8px;margin-top:16px"><button class="btn pri" style="flex:1" onclick="saveWorker('${isNew?'NEW':w.id}')">저장</button><button class="btn ghost" onclick="closeModal()">취소</button></div>`;
  document.getElementById('modal').classList.add('on');}
const EXTRA_ROLES=['홀','주방','샐러드','자재관리'];
function posIsGrid(s,k){return !!s&&!isSub(s)&&positionsOf(s).some(p=>p.key===k);}
function posOptionsFor(storeId,sel){const s=storeOf(storeId);let o='<option value="">자리 미지정</option>';const grid=s?positionsOf(s).map(p=>p.key):[];if(s)positionsOf(s).forEach(p=>o+=`<option value="${p.key}" ${p.key===sel?'selected':''}>${p.key}</option>`);EXTRA_ROLES.forEach(r=>{if(!grid.includes(r))o+=`<option value="${r}" ${r===sel?'selected':''}>${r}</option>`;});o+=`<option value="후보자" ${sel==='후보자'?'selected':''}>후보자 (대기·자동배정 안함)</option>`;return o;}
function refreshWPos(){const sid=document.getElementById('w_store').value;document.getElementById('w_pos').innerHTML=posOptionsFor(sid,'');}
function toggleWType(){const t=document.getElementById('w_type').value;const isM=(t==='salary'||t==='personal');document.getElementById('wHourly').style.display=isM?'none':'';document.getElementById('wSalary').style.display=isM?'':'none';const pw=document.getElementById('wPosWrap');if(pw)pw.style.display=t==='salary'?'none':'';}
function addWorker(){workerModal({type:'hourly',withhold:3.3},true);}
function editWorker(id){workerModal(workerOf(id),false);}
function saveWorker(id){const t=document.getElementById('w_type').value;
  const d={name:document.getElementById('w_name').value.trim()||'이름없음',type:t,phone:document.getElementById('w_phone').value,memo:document.getElementById('w_memo').value,storeId:document.getElementById('w_store').value||'',hireDate:document.getElementById('w_hire').value||'',resignDate:document.getElementById('w_resign').value||'',bankName:document.getElementById('w_bank').value,bankAccount:document.getElementById('w_acct').value,bankHolder:document.getElementById('w_holder').value};
  if(isPatrol()){const rSel=document.getElementById('w_region');d.patrolRegion=rSel?rSel.value:'';const rr=regionStores(d.patrolRegion);if(rr.length)d.storeId=rr[0].id;d.posKey='';}else{d.patrolRegion='';}
  if(t==='salary'){d.salary=parseInt(document.getElementById('w_salary').value)||0;d.withhold=parseFloat(document.getElementById('w_with').value)||0;d.rate=null;d.posKey='';}
  else if(t==='personal'){d.salary=parseInt(document.getElementById('w_salary').value)||0;d.withhold=parseFloat(document.getElementById('w_with').value)||0;d.rate=null;d.posKey=document.getElementById('w_pos').value||'';}
  else{const r=parseInt(document.getElementById('w_rate').value);d.rate=r||null;d.salary=0;d.withhold=3.3;d.posKey=document.getElementById('w_pos').value||'';d.noNight=!!document.getElementById('w_nonight').checked;}
  if(id==='NEW')S.workers.push({id:'W'+Date.now(),...d});else Object.assign(workerOf(id),d);
  save();closeModal();render();}
function delWorker(id){if(id==='W-lead'){alert('기본 팀장은 삭제할 수 없습니다. 이름을 바꿔 사용하세요.');return;}
  const used=Object.keys(S.attendance).filter(k=>S.attendance[k]&&S.attendance[k].workerId===id);
  if(used.length&&!confirm(`이 인력의 근무기록 ${used.length}건이 근무 스케줄에서 함께 삭제됩니다. 계속할까요?`))return;
  used.forEach(k=>delete S.attendance[k]);
  Object.keys(S.pay||{}).forEach(k=>{if(k.startsWith(id+'|'))delete S.pay[k];});
  S.workers=S.workers.filter(w=>w.id!==id);save();render();}

/* ---------- settings ---------- */
function saveSet(){const hk=parseInt(document.getElementById('set_hk').value)||12500;const sal=parseInt(document.getElementById('set_salad').value)||10000;
  S.settings.wageHK=hk;S.settings.wageSalad=sal;S.settings.nightRate=(parseFloat(document.getElementById('set_night').value)||50)/100;
  S.settings.otRate=(parseFloat(document.getElementById('set_ot').value)||50)/100;S.settings.shiftStart=document.getElementById('set_start').value||'22:00';S.settings.shiftEnd=document.getElementById('set_end').value||'00:00';
  S.settings.cutoffDay=Math.min(28,Math.max(2,parseInt(document.getElementById('set_cut').value)||25));
  save();render();alert('저장되었습니다.');}

/* ---------- export/import ---------- */
function exportJSON(){dl('애슐리_플랫폼_'+S.month+'.json',JSON.stringify(S,null,2),'application/json');}
function importJSON(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=migrate(JSON.parse(r.result));save();document.getElementById('monthPick').value=S.month;render();alert('가져왔습니다.');}catch(e){alert('파일을 읽을 수 없습니다.');}};r.readAsText(f);}
function setPreset(p){S.payRange={...(S.payRange||{}),preset:p};if(p==='custom'&&!(S.payRange.start&&S.payRange.end)){const d=rangeDates();S.payRange.start=iso(d[0]);S.payRange.end=iso(d[d.length-1]);}save();render();}
function applyCustom(pfx){pfx=pfx||'pr';const s=document.getElementById(pfx+'_s').value,e=document.getElementById(pfx+'_e').value;if(!s||!e){alert('시작일과 종료일을 선택하세요.');return;}if(e<s){alert('종료일이 시작일보다 빠릅니다.');return;}S.payRange={preset:'custom',start:s,end:e};save();render();}
function exportCSV(){const DTS=rangeDates();const agg=workerAgg(DTS);let rows=[['정산기간',rangeLabel()],['구분','이름','은행','계좌번호','예금주','근무일','정규h','초과h','기본급','심야','초과','지급액','3.3%공제','실지급액']];
  sortAlbaPayWorkers(S.workers.filter(w=>w.type==='hourly'),agg).forEach(w=>{const m=agg[w.id];if(m.days===0)return;const tax=t10(m.total*((w.withhold!=null?w.withhold:3.3)/100));rows.push(['알바',w.name,w.bankName||'',w.bankAccount||'',w.bankHolder||'',m.days,m.reg.toFixed(1),m.ot.toFixed(1),Math.round(m.base),Math.round(m.night),Math.round(m.otpay),Math.round(m.total),Math.round(tax),Math.round(m.total-tax)]);});
  dl('애슐리_정산_'+periodLabel()+'.csv','\uFEFF'+rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n'),'text/csv');}
function exportWorkersCSV(){let rows=[['이름','구분','소속지점','시급/월급','입사일','퇴사일','상태','연락처','은행','계좌번호','예금주','메모']];
  S.workers.forEach(w=>rows.push([w.name,w.type==='salary'?'팀장(월급)':(w.type==='personal'?'개인(월급)':'알바(시급)'),(w.storeId&&storeOf(w.storeId))?shortName(storeOf(w.storeId)):'',w.type==='salary'||w.type==='personal'?(w.salary||0):(w.rate||'자리시급'),w.hireDate||'',w.resignDate||'',w.resignDate?'퇴사':'재직',w.phone||'',w.bankName||'',w.bankAccount||'',w.bankHolder||'',w.memo||'']));
  dl('인력풀_'+S.month+'.csv','\uFEFF'+rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n'),'text/csv');}
function dl(name,content,type){const b=new Blob([content],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}

/* ---------- nav ---------- */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));document.getElementById(t.dataset.v).classList.add('on');});
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal();};
const mp=document.getElementById('monthPick');mp.value=S.month;mp.onchange=()=>{setPayMonth(mp.value);};
render();
sbStart();

</script>
</body>
</html>
