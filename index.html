<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>둥지 운영 플랫폼</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #3B8CE4;
    --blue-d: #1f6fc9;
    --ink: #1b2733;
    --mut: #6b7785;
    --bg: #f0f4f9;
    --card: #fff;
    --line: #e4e9f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: linear-gradient(120deg, #1a56b0, #3B8CE4);
    color: #fff;
    padding: 20px 28px;
    box-shadow: 0 2px 16px rgba(31,111,201,.3);
  }
  .hinner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo-circle {
    width: 44px; height: 44px;
    background: #fff;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .header-text h1 { font-size: 18px; font-weight: 900; letter-spacing: -.3px; }
  .header-text p { font-size: 12px; opacity: .85; margin-top: 2px; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .greeting {
    text-align: center;
    margin-bottom: 48px;
  }
  .greeting h2 {
    font-size: 26px;
    font-weight: 900;
    color: var(--ink);
    letter-spacing: -.5px;
    margin-bottom: 8px;
  }
  .greeting p { font-size: 15px; color: var(--mut); }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 760px;
  }

  .dash-card {
    background: var(--card);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 4px 24px rgba(20,40,80,.08);
    border: 2px solid transparent;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 16px;
    transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .dash-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--accent);
    border-radius: 20px 20px 0 0;
  }
  .dash-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 36px rgba(20,40,80,.14);
    border-color: var(--accent);
  }

  .card-icon {
    width: 56px; height: 56px;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    background: var(--icon-bg);
  }
  .card-name { font-size: 20px; font-weight: 900; color: var(--ink); letter-spacing: -.3px; }
  .card-desc { font-size: 13px; color: var(--mut); line-height: 1.6; flex: 1; }
  .card-go {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    align-self: flex-start;
    transition: filter 0.15s;
    text-decoration: none;
  }
  .card-go:hover { filter: brightness(1.1); }

  .card-eland  { --accent: #3B8CE4; --icon-bg: #EBF3FD; }
  .card-doongji { --accent: #16A34A; --icon-bg: #DCFCE7; }

  footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--mut);
    border-top: 1px solid var(--line);
  }

  @media (max-width: 640px) {
    .greeting h2 { font-size: 22px; }
    .cards { grid-template-columns: 1fr; }
    .dash-card { padding: 24px 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="hinner">
    <div class="logo-circle">🏢</div>
    <div class="header-text">
      <h1>둥지 운영 플랫폼</h1>
      <p>업무 대시보드 선택</p>
    </div>
  </div>
</header>

<main>
  <div class="greeting">
    <h2>어떤 업무를 할까요?</h2>
    <p>아래에서 담당 대시보드를 선택해주세요</p>
  </div>

  <div class="cards">

    <a class="dash-card card-eland" href="./eland/">
      <div class="card-icon">🏪</div>
      <div>
        <div class="card-name">이랜드</div>
        <div class="card-desc">미화 담당자 스케줄 · 출퇴근 기록 · 노쇼/팀장대체 · 25일 마감 정산</div>
      </div>
      <span class="card-go">
        바로가기 →
      </span>
    </a>

    <a class="dash-card card-doongji" href="./doongji/">
      <div class="card-icon">🏢</div>
      <div>
        <div class="card-name">둥지 건물</div>
        <div class="card-desc">건물별 청소 운영 · 담당자 배정 · 근무기록 · 급여정산 · 건물 지도</div>
      </div>
      <span class="card-go" style="background:#16A34A;">
        바로가기 →
      </span>
    </a>

  </div>
</main>

<footer>
  둥지 운영 플랫폼 · 이랜드 + 둥지 건물
</footer>

</body>
</html>
