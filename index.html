<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>둥지 운영 플랫폼</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #3B8CE4;
    --blue-d: #1f6fc9;
    --ink: #1b2733;
    --mut: #6b7785;
    --bg: #f0f4f9;
    --card: #fff;
    --line: #e4e9f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    background: linear-gradient(120deg, #1a56b0, #3B8CE4);
    color: #fff;
    padding: 20px 28px;
    box-shadow: 0 2px 16px rgba(31,111,201,.3);
  }
  .hinner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo-wrap {
    width: 44px; height: 44px;
    background: #fff;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  .logo-wrap img { height: 36px; }
  .header-text h1 { font-size: 18px; font-weight: 900; letter-spacing: -.3px; }
  .header-text p { font-size: 12px; opacity: .85; margin-top: 2px; }

  /* MAIN */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .greeting {
    text-align: center;
    margin-bottom: 48px;
  }
  .greeting h2 {
    font-size: 26px;
    font-weight: 900;
    color: var(--ink);
    letter-spacing: -.5px;
    margin-bottom: 8px;
  }
  .greeting p {
    font-size: 15px;
    color: var(--mut);
  }

  /* DASHBOARD CARDS */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 760px;
  }

  .dash-card {
    background: var(--card);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 4px 24px rgba(20,40,80,.08);
    border: 1px solid var(--line);
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 16px;
    transition: transform 0.18s, box-shadow 0.18s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .dash-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--accent);
    border-radius: 20px 20px 0 0;
  }
  .dash-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 36px rgba(20,40,80,.14);
  }
  .dash-card:active { transform: translateY(-1px); }

  .card-icon {
    width: 56px; height: 56px;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    background: var(--icon-bg);
  }
  .card-name {
    font-size: 20px;
    font-weight: 900;
    color: var(--ink);
    letter-spacing: -.3px;
  }
  .card-desc {
    font-size: 13px;
    color: var(--mut);
    line-height: 1.6;
    flex: 1;
  }
  .card-go {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: none;
    cursor: pointer;
    align-self: flex-start;
    transition: filter 0.15s;
    text-decoration: none;
  }
  .card-go:hover { filter: brightness(1.1); }
  .card-go svg { width: 14px; height: 14px; }

  /* Card themes */
  .card-eland { --accent: #3B8CE4; --icon-bg: #EBF3FD; }
  .card-doongji { --accent: #16A34A; --icon-bg: #DCFCE7; }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--mut);
    border-top: 1px solid var(--line);
  }

  /* LOGO in HTML (base64 fallback to text) */
  .logo-text {
    font-weight: 900;
    font-size: 20px;
    color: var(--blue);
  }

  @media (max-width: 640px) {
    .greeting h2 { font-size: 22px; }
    .cards { grid-template-columns: 1fr; }
    .dash-card { padding: 24px 20px; }
  }
</style>
</head>
