<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시대인재 미화 운영 대시보드</title>
<style>
:root{
  --paper:#F6F5F1; --panel:#fff; --ink:#17171A; --muted:#6E6E68; --line:#E3E2DB; --line2:#EFEEE8;
  --day:#A96A0C; --dayBg:#FBF1DF; --night:#2F3F86; --nightBg:#E9ECF8;
  --vend:#1C6156; --vendBg:#E3F0EB;
  --ok:#1F6E43; --okBg:#E4F2EA; --warn:#9A3412; --warnBg:#FBEAE3; --off:#8A8A84; --offBg:#EFEFEA;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}

/* ---------- shell ---------- */
header.top{
  position:sticky;top:0;z-index:50;background:rgba(246,245,241,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.topin{max-width:1600px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px}
.brand b{font-size:15px}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.06em}
nav.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{
  background:none;border:1px solid transparent;padding:6px 12px;border-radius:var(--r);
  color:var(--muted);cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap
}
nav.tabs button:hover{background:#EDECE5;color:var(--ink)}
nav.tabs button.on{background:var(--ink);color:#fff}
.tools{display:flex;gap:6px}
main{max-width:1600px;margin:0 auto;padding:18px}
section.view{display:none}
section.view.on{display:block}

/* ---------- primitives ---------- */
.btn{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:6px 11px;cursor:pointer;font-size:12.5px;font-weight:600}
.btn:hover{border-color:#C9C8C0;background:#FCFCFA}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#333}
.btn.sm{padding:3px 8px;font-size:11.5px;font-weight:500}
.btn.danger{color:#9A2B1F}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.pad{padding:14px 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}
.tiny{font-size:11px}
.sechead{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.sechead h2{font-size:14px}
.sechead .hint{font-size:11.5px;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);font-weight:600}
label.f input,label.f select{
  border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;background:#fff;font-size:12.5px;color:var(--ink);font-weight:400
}
input,select{outline:none}
input:focus,select:focus{border-color:#9A9A92;box-shadow:0 0 0 2px #E7E6DE}
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:700;line-height:1.6}
.pill.day{background:var(--dayBg);color:var(--day)}
.pill.night{background:var(--nightBg);color:var(--night)}
.pill.ok{background:var(--okBg);color:var(--ok)}
.pill.warn{background:var(--warnBg);color:var(--warn)}
.pill.off{background:var(--offBg);color:var(--off)}
.pill.b4{background:#E8EDF6;color:#2C4A7C}
.pill.b33{background:#F3ECE0;color:#7C5A22}
.pill.temp{background:#F0E7F3;color:#6B3E7C}
.chip{display:inline-block;padding:1px 7px;margin-right:3px;border-radius:5px;font-size:11px;font-weight:600;
  border:1px solid var(--line);background:#fff;color:#B0AFA7;cursor:pointer;user-select:none}
.chip:hover{border-color:#B9B8B0}
.chip.on{background:var(--okBg);color:var(--ok);border-color:#BCDDCB}

/* ---------- tables ---------- */
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap}
thead th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
thead th.sortable:hover{background:#F1F0E9;color:var(--ink)}
thead th.sortable.on{color:var(--ink)}
thead th .arw{margin-left:3px;font-size:9px;opacity:.45}
thead th.sortable.on .arw{opacity:1}
thead th{
  position:sticky;top:0;z-index:5;background:#FAF9F5;font-size:11px;color:var(--muted);
  font-weight:700;letter-spacing:.02em;border-bottom:1px solid var(--line)
}
tbody tr:hover{background:#FAFAF6}
td.num,th.num{text-align:right}
.grp td{background:#F1F0EA;font-weight:700;font-size:11.5px;color:#4A4A44}
.grp td .gl{position:sticky;left:10px;display:inline-block;max-width:calc(100vw - 120px)}
tbody tr.dim td{color:#A4A49C}

/* schedule grid */
table.sched td.cell{cursor:pointer;text-align:center;min-width:78px;border-left:1px solid var(--line2)}
table.sched td.cell:hover{background:#F0EFE7;box-shadow:inset 0 0 0 1px #D6D5CC}
table.sched td.cell.has{font-weight:600}
table.sched td.cell.empty{color:#C3C2BA}
table.sched td.cell.weekend{background:#FCFBF6}
table.sched td.cell.weekend:hover{background:#F2F1E9}
table.sched td.cell.direct{color:var(--muted);font-style:italic}
table.sched td.cell.vend{color:var(--vend);background:var(--vendBg);font-weight:600}
table.sched td.cell.bad{color:#B3452F;background:#FBEDE7;font-weight:600}
table.sched td.cell.offday{
  color:#4E4D46;font-weight:700;letter-spacing:.02em;
  background-color:#E6E4DA;
  background-image:repeating-linear-gradient(-45deg,rgba(0,0,0,.10) 0 4px,transparent 4px 9px);
  box-shadow:inset 0 0 0 1px #D2D0C4}
table.sched td.cell.offday:hover{background-color:#DEDCD0}
table.sched td.cell.editing{box-shadow:inset 0 0 0 2px var(--ink)}
table.sched td.cell.ovr{text-decoration:underline;text-decoration-color:var(--day);text-underline-offset:2px}
table.sched.month td.cell{min-width:56px;max-width:70px;padding:4px 3px;font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
table.sched.month th{padding:4px 3px;min-width:56px}
table.sched.month th.sun{color:#B3452F}table.sched.month th.sat{color:#2F3F86}
table.sched td.cell.bad:hover{background:#F6E1D8}
table.sched td.cell.vend:hover{background:#DCEBE4}
.pill.vend{background:var(--vendBg);color:var(--vend)}
.sched td.sticky .fl{cursor:pointer;border-bottom:1px dotted #C9C8C0}
.sched td.sticky .fl:hover{color:#2F3F86;border-bottom-color:#2F3F86}
.sched td.sticky .fx{float:right;padding:0 6px;line-height:18px;opacity:0;transition:.12s}
.sched tr:hover td.sticky .fx{opacity:1}
table.sched td.sticky,table.sched th.sticky{position:sticky;left:0;background:#fff;z-index:4;border-right:1px solid var(--line)}
table.sched tr.grp td{position:relative}
table.sched thead th.sticky{z-index:6;background:#FAF9F5}
table.sched tr:hover td.sticky{background:#FAFAF6}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.kpi .k{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.kpi .v{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .s{font-size:11px;color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.split{grid-template-columns:1fr}}

/* bar */
.bar{height:7px;background:#EDECE4;border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* modal */
.mask{position:fixed;inset:0;background:rgba(20,20,18,.42);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:12px;width:min(760px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h3{font-size:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mbody{padding:16px 18px}
.mfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.dayck{display:flex;gap:4px;flex-wrap:wrap}
.dayck label{
  border:1px solid var(--line);border-radius:var(--r);padding:5px 9px;cursor:pointer;font-size:12px;
  display:flex;align-items:center;gap:4px;user-select:none;background:#fff
}
.dayck input{margin:0}
.dayck label.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dwall{border:1px solid var(--line);border-radius:var(--r);padding:5px 11px;cursor:pointer;font-size:12px;
  background:#fff;user-select:none;white-space:nowrap;font-weight:600;color:#4A4A44;flex:none}
.dwall:hover{border-color:#B9B8B0}
.dwall.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.picker{position:fixed;z-index:300;background:#fff;border:1px solid #C9C8C0;border-radius:9px;
  box-shadow:0 12px 34px rgba(20,20,18,.22);width:236px;overflow:hidden}
.picker .pq{width:100%;border:0;border-bottom:1px solid var(--line);padding:9px 11px;font-size:13px;outline:none}
.picker .plist{max-height:290px;overflow:auto;padding:4px}
.picker .pg{font-size:10.5px;font-weight:700;color:var(--muted);padding:7px 8px 3px;letter-spacing:.04em}
.picker .pi{padding:6px 9px;border-radius:5px;cursor:pointer;font-size:12.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.picker .pi:hover,.picker .pi.hi{background:#EFEEE7}
.picker .pi.sel{background:var(--ink);color:#fff}
.picker .pi .h{font-size:10.5px;color:var(--muted)}
.picker .pi.sel .h{color:#C9C8C0}
.picker .pempty{padding:16px;text-align:center;color:var(--muted);font-size:12px}
.syncbar{max-width:1600px;margin:0 auto;padding:7px 18px 0;display:flex;align-items:center;gap:7px;
  font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.syncbar .sbtn{border:1px solid var(--line);background:#fff;border-radius:5px;padding:2px 8px;
  font-size:11px;font-weight:600;cursor:pointer;color:#4A4A44}
.syncbar .sbtn:hover{border-color:#B9B8B0;background:#FCFCFA}
.syncbar b{color:var(--ink);font-size:12px}
.syncbar .sep{color:#C9C8C0}
.syncbar .sdot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#B8B5A8;flex:none}
.syncbar .sdot.ok{background:#25A05C;box-shadow:0 0 0 3px rgba(37,160,92,.16)}
.syncbar .sdot.busy{background:#D19A16;box-shadow:0 0 0 3px rgba(209,154,22,.16)}
.syncbar .sdot.err{background:#C0392B;box-shadow:0 0 0 3px rgba(192,57,43,.16)}
.syncbar .sname{font-weight:700;color:#3A3A34}
.sqlbox{background:#17171A;color:#E8E7E1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
  padding:11px 13px;border-radius:8px;white-space:pre;overflow:auto;line-height:1.55}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:#17171A;color:#fff;padding:9px 16px;border-radius:20px;font-size:12.5px;z-index:200;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1;bottom:30px}
.empty{padding:38px;text-align:center;color:var(--muted);font-size:12.5px}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
@media print{
  header.top,.tools,.noprint{display:none!important}
  body{background:#fff}
  .tw{max-height:none;border:0}
  main{padding:0}
  thead th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
thead th.sortable:hover{background:#F1F0E9;color:var(--ink)}
thead th.sortable.on{color:var(--ink)}
thead th .arw{margin-left:3px;font-size:9px;opacity:.45}
thead th.sortable.on .arw{opacity:1}
thead th{position:static}
}
</style>
</head>
<body>

<header class="top">
  <div class="topin">
    <div class="brand"><b>시대인재 미화 운영</b><span>배치 · 인사 · 급여</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="tools">
      <button class="btn sm" onclick="exportJSON()">백업 저장</button>
      <button class="btn sm" onclick="document.getElementById('imp').click()">백업 불러오기</button>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="importJSON(this)">
    </div>
  </div>
</header>

<div class="syncbar" id="syncbar"></div>
<main>
  <section class="view" id="v-home"></section>
  <section class="view" id="v-sched"></section>
  <section class="view" id="v-staff"></section>
  <section class="view" id="v-vendor"></section>
  <section class="view" id="v-pay"></section>
  <section class="view" id="v-set"></section>
</main>

<div class="mask" id="mask" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

async function load(){
  let saved=null;
  try{ const r=await window.storage.get('sidae-cleaning-v1'); if(r&&r.value) saved=JSON.parse(r.value); }catch(e){}
  if(!saved && window.__mem) saved=window.__mem;
  if(saved){ S=saved; }
  else{
    S=JSON.parse(JSON.stringify(DEFAULTS));
    S.buildings=SEED.buildings.map(b=>({...b, assign:{주간:{...b.day}, 야간:{...b.night}}, day:undefined, night:undefined}));
    S.staff=SEED.staff.map(s=>({...s, wage:s.wage||S.settings.baseWage, vendorId:s.vendorId||''}));
    S.vendors=[{id:'V001',name:'그린파트너스',ceo:'',tel:'010-4776-1230',biz:'',regions:['대전'],
      type:'월정액',amount:3700000,rate:0,vat:'별도',start:'',end:'',note:'대전 지역 전담'}];
  }
  S.settings=Object.assign({},DEFAULTS.settings,S.settings||{});
  /* 1회 마이그레이션: 목동 주간 근로자 1일 6시간 */
  if(S._day6===1){                       /* 직전 버전에서 전체 6시간이 적용된 경우 되돌림 */
    S.staff.forEach(s=>{ if(s.shift==='주간' && s.region!=='목동') s.hours=8; });
  }
  if(S._day6!==2){
    S._day6=2;
    S.staff.forEach(s=>{ if(s.shift==='주간'){ s.nightHours=0; if(s.region==='목동') s.hours=6; } });
  }
  /* 1회 마이그레이션: 아크 도급업체 등록 및 소속 지정 */
  if(!S._arc){
    S._arc=1;
    if(!(S.vendors||[]).some(v=>v.name==='아크')){
      S.vendors.push({id:uid('V'),name:'아크',ceo:'',tel:'',biz:'',regions:['목동'],
        type:'인원단가',amount:0,rate:0,vat:'별도',start:'',end:'',
        note:'도급 — 김희수 · 김성권 · 박미화(최원희)'});
    }
    const arc=(S.vendors.find(v=>v.name==='아크')||{}).id;
    ['김희수','김성권','박미화','최원희'].forEach(n=>{
      const s=S.staff.find(x=>x.name===n);
      if(s && !s.vendorId) s.vendorId=arc;
    });
  }
  CS.rev=Number(S._rev)||0; CS.lastJson=snapshotJson();
  setTimeout(()=>{ if(cloudReady()) cloudPull(false); }, 400);
  S.vendors=S.vendors||[]; S.snapshots=S.snapshots||{}; S.overrides=S.overrides||{}; S.vendorPay=S.vendorPay||{}; S.extras=S.extras||{}; S.dutyOv=S.dutyOv||{}; S.manualOv=S.manualOv||{};
  S.cloud=Object.assign({}, CLOUD_DEFAULT, S.cloud||{});
  if(!S.cloud.url){ S.cloud.url=CLOUD_DEFAULT.url; S.cloud.key=CLOUD_DEFAULT.key; S.cloud.on=true; }
  S.cloud.url=baseUrl(S.cloud.url);
  S.staff.forEach(s=>{
    if(s.vendorId===undefined) s.vendorId='';
    ['payee','phone','uniformSize','note'].forEach(k=>{ if(s[k]===undefined) s[k]=''; });
    ['uniformGiven','idCopy','bankbook','contract'].forEach(k=>{ if(s[k]===undefined) s[k]=false; });
    if(!s.empType) s.empType='상시';
    if(!s.site) s.site='시대인재';
    if(!Array.isArray(s.duties)) s.duties=[];
    if(!Array.isArray(s.dutyKeys)) s.dutyKeys=[];
    if(s.listed===undefined) s.listed=true;
  });
  render();
}

function statusMatch(s,ym){
  const f=SF.status, st=statusOf(s);
  if(f==='전체') return true;
  if(f==='기준월 재직') return activeInMonth(s,ym);
  if(f==='퇴사자만') return st==='퇴사';
  if(f==='기준월 퇴사') return !!s.leave && s.leave.slice(0,7)===ym;
  if(f==='퇴사예정') return st==='퇴사예정';
  return st!=='퇴사';
}
function docsMatch(s){
  const f=SF.docs;
  if(!f) return true;
  if(f==='미비만') return !docsDone(s);

  return true;
}

function activeOn(s,dateStr){

function monthDates(ym){

    out.push({date:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`, dow:DAYS[(dt.getDay()+6)%7]});

function prevMonths(ym,n){

  for(let i=0;i<n;i++){ const d=new Date(y,m-1-i,1);
    out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
  return out;
}
function spotCount(name, ym){
  return Object.entries(S.overrides||{}).filter(([k,val])=>k.startsWith(ym)&&val===name).length;
}
function calcVendor(v, ym){
  const rows=vendorRows(v);
  const spot=spotCount(v.name, ym);
  const area=rows.reduce((a,b)=>a+(b.area||0),0);
  const heads=S.staff.filter(s=>s.vendorId===v.id && statusOf(s)!=='퇴사').length;
  const dates=monthDates(ym);
  let days=dates.length, active=dates.filter(d=>(!v.start||d.date>=v.start)&&(!v.end||d.date<=v.end)).length;
  const ratio=days?active/days:0;
  let supply=0;
  if(v.type==='월정액') supply=(Number(v.amount)||0)*ratio;
  else if(v.type==='평단가') supply=(Number(v.rate)||0)*area*ratio;
  else if(v.type==='인원단가') supply=(Number(v.rate)||0)*heads*ratio;
  else if(v.type==='건당') supply=(Number(v.rate)||0)*spot;
  const extra=vExtraSum(v.id, ym);
  supply=Math.round(supply)+extra;
  const vat=v.vat==='별도'? Math.round(supply*0.1) : 0;
  const net=v.vat==='포함'? Math.round(supply/1.1) : supply;
  return {rows:rows.length, area, heads, spot, ratio, active, days, supply, extra,
          extraCount:vExtras(v.id,ym).length, vat, total:supply+vat, net};
}
function vendorTotal(ym){ return (S.vendors||[]).reduce((a,v)=>a+calcVendor(v,ym).total,0); }

const EXTRA_TYPES=['추가근무','대타','알바','수당','공제'];
const VEXTRA_TYPES=['추가청소','자재비','특수작업','인력추가','감액'];
function vExtraAmount(e){

}
function vExtras(id,ym){ return extrasOf(id,ym); }
function vExtraSum(id,ym){ return vExtras(id,ym).reduce((a,e)=>a+vExtraAmount(e),0); }
function exKey(id,ym){ return ym+'|'+id; }

function extraAmount(s,e){

  if(e.amount!=null && e.amount!=='') return Number(e.amount)||0;

}

function extraDel(id,ym,i){

function gwanPayOf(s,ym){
  const rows=(s.duties||[]).filter(r=>Number(r.amount));
  if(!rows.length) return {total:0, items:[]};
  const dates=monthDates(ym), items=[];
  rows.forEach(r=>{
    const amt=Number(r.amount)||0;
    const label=(S.buildings.find(b=>gwanKeyOf(b)===r.key)||{});
    const nm=label.building? bldgLabel(label) : r.key;
    if(!r.from && !r.to){ items.push({name:nm, amount:amt, note:'상시'}); return; }
    const base=dates.filter(d=>r.dows.includes(d.dow)).length;
    let hit=0;
    const f=r.from||dates[0].date, t=r.to||dates[dates.length-1].date;
    if(t<dates[0].date || f>dates[dates.length-1].date) return;
    eachDate(f>dates[0].date?f:dates[0].date, t<dates[dates.length-1].date?t:dates[dates.length-1].date, (dt,dow)=>{
      if(dt.slice(0,7)!==ym) return;
      if(r.dows.includes(dow)) hit++;
    });
    if(!hit) return;
    const val=Math.round(amt*(base? Math.min(hit/base,1):0));
    items.push({name:nm, amount:val, note:`${dutyPeriodLabel(r)} · ${hit}/${base}일`});
  });
  return {total:items.reduce((a,x)=>a+x.amount,0), items};
}
function serviceMonths(s,ym){
  if(!s.join) return 0;
  const [jy,jm]=s.join.slice(0,7).split('-').map(Number);
  const [y,m]=ym.split('-').map(Number);
  return (y-jy)*12+(m-jm);
}

/* ============ payroll ============ */
function calcPay(s, ym){
  const st=S.settings, dates=monthDates(ym);
  const pattern=dates.filter(d=>(s.workDays||[]).includes(d.dow) && activeOn(s,d.date));
  let assigned=[], onSched=false;
  try{
    const set=monthIndex(ym)[s.name];
    if(set) assigned=[...set].filter(dt=>activeOn(s,dt));
    onSched=inSchedule(s.name,ym);
  }catch(e){}
  const useAssigned = st.payBasis==='배치표' || ((st.payBasis||'자동')==='자동' && onSched);
  const work = useAssigned? assigned : pattern;
  const patternDays=pattern.length, assignedDays=assigned.length;
  const totalInMonth=dates.filter(d=>(s.workDays||[]).includes(d.dow)).length;
  const h=Number(s.hours)||0, nh=Number(s.nightHours)||0, wage=Number(s.wage)||0;
  const regular = (s.empType||'상시')!=='당일';
  let base=0, night=0, weekly=0, meal=0;
  if(s.payType==='월급'){
    const ratio=totalInMonth? work.length/totalInMonth : 0;
    base=Math.round(wage*ratio);
  }else{
    base=Math.round(wage*h*work.length);
    night=Math.round(wage*st.nightMul*nh*work.length);
    const weeklyHours=h*(s.workDays||[]).length;
    if(st.weeklyPay && regular && weeklyHours>=(st.minWeeklyHours||15)){
      const weeks=work.length/Math.max((s.workDays||[]).length,1);
      weekly=Math.round(wage*Math.min(weeklyHours,40)/40*8*weeks);
    }
  }
  const ratio=totalInMonth? work.length/totalInMonth : 0;
  /* 연차수당 — 월할 지급 */
  let annual=0, annualDays=0, annualNote='';
  if(st.annualPay && regular && s.payType!=='월급'){
    const wh=h*(s.workDays||[]).length;
    if(wh>=(st.minWeeklyHours||15)){
      const mon=serviceMonths(s,ym), daily=wage*h;
      if(s.annualDays!=null){
        annualDays=Number(s.annualDays);
        annual=Math.round(daily*annualDays/12*ratio);
        annualNote=`연 ${annualDays}일 ÷ 12개월`;
      }else if(mon>=12){
        annualDays=st.annualDaysO1||15;
        annual=Math.round(daily*annualDays/12*ratio);
        annualNote=`1년 이상 · 연 ${annualDays}일 ÷ 12개월`;
      }else{
        /* 1년 미만: 1개월 개근 시 1일 발생 (최대 ${st.annualDaysU1}일) */
        const used=Math.max(0,Math.min(mon, st.annualDaysU1||11));
        annualDays=(mon>=1 && used<(st.annualDaysU1||11)+0)?1:0;
        if(mon>=1 && mon<=(st.annualDaysU1||11)) annualDays=1; else annualDays=0;
        annual=Math.round(daily*annualDays*ratio);
        annualNote=annualDays? `1년 미만 · 월 1일 발생 (${mon}/${st.annualDaysU1||11}개월)` : '발생 없음';
      }
    }
  }
  const mealDay = s.mealDaily!=null? Number(s.mealDaily) : (s.shift==='주간'? (st.mealDaily||0) : 0);
  meal = mealDay? Math.round(mealDay*work.length) : Math.round((Number(s.meal)||0)*ratio);
  const ex=extrasOf(s.id,ym);
  const exPay=ex.reduce((a,e)=>a+extraAmount(s,e),0);
  const exHours=ex.reduce((a,e)=>a+(Number(e.hours)||0),0);
  const gp=gwanPayOf(s,ym);
  const gross=base+night+weekly+annual+meal+exPay+gp.total;
  const taxable=gross-Math.min(meal,200000);
  let ded={}, dedTotal=0, employer={}, empTotal=0;
  if(s.emp==='4대보험'){
    const i=st.ins;
    ded.np=Math.round(taxable*i.np/100); ded.hi=Math.round(taxable*i.hi/100);
    ded.ltc=Math.round(ded.hi*i.ltc/100); ded.ei=Math.round(taxable*i.ei/100);
    dedTotal=ded.np+ded.hi+ded.ltc+ded.ei;
    const e=st.insEmp;
    employer.np=Math.round(taxable*e.np/100); employer.hi=Math.round(taxable*e.hi/100);
    employer.ltc=Math.round(employer.hi*e.ltc/100); employer.ei=Math.round(taxable*e.ei/100);
    employer.iacc=Math.round(taxable*e.iacc/100);
    const weeklyHours=h*(s.workDays||[]).length;
    employer.sev=weeklyHours>=15? Math.round(gross*st.sev/100):0;
    empTotal=employer.np+employer.hi+employer.ltc+employer.ei+employer.iacc+employer.sev;
  }else{
    ded.tax=Math.round(gross*st.freelanceTax/100);
    dedTotal=ded.tax;
  }
  return {work:work.length, totalInMonth, patternDays, assignedDays, totalInMonthActive:patternDays,
          basis: useAssigned?'배치표':'요일', mealDay, exPay, exHours, exCount:ex.length,
          annual, annualDays, annualNote, regular, gwanPay:gp.total, gwanItems:gp.items,
          base, night, weekly, meal, gross, taxable, ded, dedTotal,
          net:gross-dedTotal, employer, empTotal, cost:gross+empTotal};
}

let _idx={ym:null,map:null,listed:null};
function monthIndex(ym){
  if(_idx.ym===ym && _idx.map) return _idx.map;
  const map={}, listed=new Set(), detail={};
  const dates=monthDates(ym);
  S.buildings.forEach(b=>['주간','야간'].forEach(sh=>{
    Object.values(assignOf(b,sh,ym)).forEach(v=>{
      if(v&&!SPECIALS.includes(v)&&!vendorByName(v)) listed.add(v);
    });
    dates.forEach(d=>{
      const {v}=cellAt(b,sh,ym,d.date,d.dow);
      if(!v||SPECIALS.includes(v)||vendorByName(v)) return;
      listed.add(v);
      (map[v]=map[v]||new Set()).add(d.date);
      const key=bldgLabel(b);
      const dd=(detail[v]=detail[v]||{});
      (dd[d.date]=dd[d.date]||new Set()).add(key);
    });
  }));
  _idx={ym,map,listed,detail}; return map;
}
function inSchedule(name,ym){ monthIndex(ym); return _idx.listed && _idx.listed.has(name); }
function dutyDetail(name,ym){
  monthIndex(ym);
  const dd=(_idx.detail||{})[name]||{};
  const byG={}, dates=Object.keys(dd).sort();
  let multi=0;
  dates.forEach(dt=>{ const set=dd[dt]; if(set.size>1) multi++;
    set.forEach(g=>{ byG[g]=(byG[g]||0)+1; }); });
  return {byG, dates, dd, multi, days:dates.length};
}
/* 요일 패턴 기준 담당 관 목록 (이름 -> [{label, dows}]) */
function weekStart(d){
  const t=d? new Date(d) : new Date();
  const off=(t.getDay()+6)%7;
  t.setDate(t.getDate()-off);
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
}
function gwanList(){
  const m={};
  S.buildings.forEach(b=>{
    const k=b.building+'|'+b.gwan;
    if(!m[k]) m[k]={key:k, label:bldgLabel(b), region:b.region, rows:[]};
    m[k].rows.push(b);
  });
  return Object.values(m).sort((a,c)=>a.region.localeCompare(c.region)||a.label.localeCompare(c.label));
}
function gwanKeyOf(b){ return b.building+'|'+b.gwan; }
function patternDuty(name){
  const out={};
  S.buildings.forEach(b=>['주간','야간'].forEach(sh=>{
    const a=(b.assign&&b.assign[sh])||{};
    DAYS.forEach(d=>{ if(a[d]===name){ const k=gwanKeyOf(b); (out[k]=out[k]||new Set()).add(d); } });
  }));
  const names={}; S.buildings.forEach(b=>names[gwanKeyOf(b)]=bldgLabel(b));
  return Object.entries(out).map(([key,set])=>({key, label:names[key]||key, dows:DAYS.filter(d=>set.has(d))}));
}

function filteredRows(ym){
  const q=F.q.trim().toLowerCase();
  let rows=S.buildings.filter(b=>(!F.region||b.region===F.region)&&(!F.gubun||b.gubun===F.gubun));
  if(q) rows=rows.filter(b=>{
    const a=assignOf(b,F.shift,ym);
    return [b.building,b.gwan,b.floor,b.addr,b.note,...Object.values(a)].join(' ').toLowerCase().includes(q);
  });
  return rows;

function issueOf(v,date,dow,ym){
  if(!v) return '';
  if(vendorByName(v)||SPECIALS.includes(v)) return '';
  const s=staffByName(v);
  if(!s) return '미등록';
  if(date? !activeOn(s,date) : !activeInMonth(s,ym)) return s.leave? '퇴사':'미재직';
  if(!(s.workDays||[]).includes(dow)) return '휴무';
  return '';
}

function cellTd(bid,mode,key,v,iss,weekend,ov){

let _picker=null;
function closePicker(){
  if(_picker){ _picker.el.remove(); document.removeEventListener('mousedown',_picker.out,true); _picker=null; }
  document.querySelectorAll('td.cell.editing').forEach(t=>t.classList.remove('editing'));
}
function pickerScroll(e){ if(_picker && !_picker.el.contains(e.target)) closePicker(); }
function openPicker(anchor, items, cur, onPick){
  closePicker();
  const el=document.createElement('div'); el.className='picker';
  el.innerHTML=`<input class="pq" placeholder="이름 검색"><div class="plist"></div>`;
  document.body.appendChild(el);
  const q=el.querySelector('.pq'), list=el.querySelector('.plist');
  let hi=-1, view=[];
  function draw(){
    const f=q.value.trim().toLowerCase();
    view=items.filter(it=>!f||it.label.toLowerCase().includes(f)||(it.hint||'').toLowerCase().includes(f));
    let html='', g='';
    view.forEach((it,n)=>{
      if(it.group!==g){ g=it.group; if(g) html+=`<div class="pg">${esc(g)}</div>`; }
      html+=`<div class="pi ${it.value===cur?'sel':''} ${n===hi?'hi':''}" data-n="${n}">
        <span>${esc(it.label)}</span>${it.hint?`<span class="h">${esc(it.hint)}</span>`:''}</div>`;
    });
    list.innerHTML=html||`<div class="pempty">일치하는 담당자가 없습니다</div>`;
  }
  draw();
  list.onmousedown=e=>{
    const row=e.target.closest('.pi'); if(!row) return;
    e.preventDefault(); const it=view[+row.dataset.n]; closePicker(); onPick(it.value);
  };
  q.oninput=()=>{ hi=-1; draw(); };
  q.onkeydown=e=>{
    if(e.key==='Escape'){ e.preventDefault(); closePicker(); renderSchedTable(); }
    else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault(); hi=Math.max(0,Math.min(view.length-1, hi+(e.key==='ArrowDown'?1:-1))); draw();
      const n=list.querySelector('.pi.hi'); if(n) n.scrollIntoView({block:'nearest'});
    }
    else if(e.key==='Enter'){ e.preventDefault(); const it=view[hi<0?0:hi]; if(it){ closePicker(); onPick(it.value); } }
  };
  const r=anchor.getBoundingClientRect();
  const w=236, hgt=Math.min(340, 46+view.length*30+30);
  el.style.left=Math.max(8, Math.min(window.innerWidth-w-8, r.left))+'px';
  el.style.top=(r.bottom+6+hgt>window.innerHeight? Math.max(8,r.top-hgt-6) : r.bottom+4)+'px';
  const out=e=>{ if(!el.contains(e.target)){ closePicker(); } };
  document.addEventListener('mousedown',out,true);
  _picker={el,out};
  q.focus();
}
window.addEventListener('resize',closePicker);
document.addEventListener('scroll',pickerScroll,true);

function editCell(td){

  const b=S.buildings.find(x=>x.id===td.dataset.id), mode=td.dataset.mode, k=td.dataset.k;
  const dow = mode==='dow'? k : DAYS[(new Date(k).getDay()+6)%7];
  const cur = mode==='dow' ? ((b.assign[F.shift]||{})[k]||'') : cellAt(b,F.shift,ym,k,dow).v;

  const items=[];
  if(mode==='date'){
    const base=(b.assign[F.shift]||{})[dow]||'';
    items.push({group:'',label:'원래대로 (요일 패턴)',value:'__RESET__',hint:base||'없음'});
    items.push({group:'공석 처리',label:'휴무 · 미투입',value:SPOT_OFF,hint:'급여 제외'});
    items.push({group:'공석 처리',label:'직수행',value:'직수행',hint:'내부 처리'});
    (S.vendors||[]).forEach(v=>items.push({group:'도급업체 대체',label:v.name,value:v.name}));
    const temps=S.staff.filter(s=>s.empType==='당일'&&activeOn(s,k)&&statusOf(s)!=='퇴사')
      .sort((a,c)=>a.name.localeCompare(c.name));
    temps.forEach(s=>items.push({group:'당일 투입 인력',label:s.name,value:s.name,
      hint:s.join===s.leave?'1일':(s.phone||'')}));
    items.push({group:'당일 투입 인력',label:'+ 새 당일 인력 등록',value:'__NEW__'});
  }else{
    items.push({group:'',label:'— 미배정 —',value:''});
    items.push({group:'',label:'직수행',value:'직수행'});
    (S.vendors||[]).forEach(v=>items.push({group:'도급업체',label:v.name,value:v.name}));
    S.staff.filter(s=>statusOf(s)!=='퇴사'&&s.shift===F.shift&&s.empType!=='당일'&&activeInMonth(s,ym))
      .sort((a,c)=>(a.region===F.region?0:1)-(c.region===F.region?0:1)||a.name.localeCompare(c.name))
      .forEach(s=>items.push({group:'직영 담당자',label:s.name,value:s.name,
        hint:[s.region!==F.region?s.region:'', (s.workDays||[]).includes(dow)?'':dow+' 휴무'].filter(Boolean).join(' · ')}));
  }
  if(cur && !items.some(it=>it.value===cur)) items.push({group:'현재 값',label:cur,value:cur});

  td.classList.add('editing');
  openPicker(td, items, cur, v=>{
    if(v==='__NEW__'){ newSpotWorker(b.id,F.shift,k); return; }
    if(mode==='dow'){
      if(!b.assign[F.shift]) b.assign[F.shift]={};
      if(v && v!=='__RESET__') b.assign[F.shift][k]=v; else delete b.assign[F.shift][k];
    }else{
      S.overrides=S.overrides||{}; S.manualOv=S.manualOv||{};
      const key=ovKey(k,b.id,F.shift);
      if(v==='__RESET__'){ delete S.overrides[key]; delete S.manualOv[key]; delete (S.dutyOv||{})[key]; }
      else { S.overrides[key]=v; S.manualOv[key]=1; delete (S.dutyOv||{})[key]; }
    }
    _idx.map=null; save(); renderSchedTable();
  });
}

    workDays:[DAYS[(new Date(date).getDay()+6)%7]],
    join:date,leave:date,note:'공석 일시 투입',memo:'',bldgWeek:[],bldgWeekend:[],

function validRows(rows){ return rows.filter(r=>r.key&&r.floors.length&&r.dows.length); }
/* 종료일이 없는 행 = 그 날짜부터 계속 → 요일 패턴에 반영 */
function ongoingRows(rows){ return validRows(rows).filter(r=>!r.to); }
/* 종료일이 있는 행 = 한시적 → 날짜별 기록 */
function datedRows(rows){ return validRows(rows).filter(r=>!!r.to); }
function dutyWanted(rows){

      const m=(want[id]=want[id]||{});
      r.dows.forEach(d=>{

        m[d] = (cur===undefined)? (r.from||'') : (r.from&&cur? (r.from<cur? r.from:cur) : '');
      });

}
function eachDate(from,to,fn){
  if(!from) return;
  const end = to || from;
  let d=new Date(from), z=new Date(end), guard=0;
  while(d<=z && guard++<400){
    const s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    fn(s, DAYS[(d.getDay()+6)%7]);
    d.setDate(d.getDate()+1);
  }
}
function applyDutyPreview(name, shift, rows){
  const taken=[];
  const seen=(b,d,label)=>{
    const a=(b.assign&&b.assign[shift])||{};
    if(a[d]&&a[d]!==name) taken.push(`${bldgLabel(b)} ${b.floor} ${d}요일${label?' ('+label+')':''} — 현재 ${a[d]}`);
  };
  validRows(rows).forEach(r=>{
    r.floors.forEach(id=>{
      const b=S.buildings.find(x=>x.id===id); if(!b) return;
      r.dows.forEach(d=>seen(b,d, r.to? dutyPeriodLabel(r):''));
    });
  });
  return {taken:[...new Set(taken)]};
}

/* 이 사람의 배치를 전부 지우고 duties 기준으로 다시 그린다 */
function horizonMonths(eff, rows){
  const set=new Set();
  const push=(y,m)=>{ const d=new Date(y,m,1);
    set.add(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); };
  const seed=ym=>{ const [y,m]=ym.split('-').map(Number); for(let k=-2;k<=2;k++) push(y,m-1+k); };
  seed((eff||S.payMonth).slice(0,7));
  seed(S.payMonth);
  (rows||[]).forEach(r=>{ if(r.from) seed(r.from.slice(0,7)); if(r.to) seed(r.to.slice(0,7)); });
  return [...set].sort();
}
function applyDutyAll(s, shift, rows, eff){
  const name=s.name;
  S.overrides=S.overrides||{}; S.dutyOv=S.dutyOv||{};
  const months=horizonMonths(eff, rows);

  /* 1) 변경 전 화면에 보이던 값을 날짜별로 기억 */
  const before={};
  months.forEach(m=>monthDates(m).forEach(d=>{
    S.buildings.forEach(b=>{
      before[d.date+'|'+b.id] = cellAt(b, shift, m, d.date, d.dow).v || '';
    });
  }));

  /* 2) 이 사람이 남긴 흔적을 전부 제거 (패턴 + 자동 생성 override + 과거 잔여 기록) */
  let swept=0;
  Object.keys(S.dutyOv).forEach(k=>{
    if(S.dutyOv[k]===s.id){ delete S.overrides[k]; delete S.dutyOv[k]; }
  });
  (s.dutyKeys||[]).forEach(k=>{ if(S.overrides[k]===name){ delete S.overrides[k]; delete S.dutyOv[k]; } });
  /* 이전 버전이 남긴 추적 불가 기록 청소 — 근무배치 화면에서 직접 지정한 것은 보존 */
  Object.keys(S.overrides).forEach(k=>{
    if(S.overrides[k]!==name) return;
    if((S.manualOv||{})[k]) return;
    const mm=k.slice(0,7);
    if(!months.includes(mm)) return;
    delete S.overrides[k]; delete S.dutyOv[k]; swept++;
  });
  S.buildings.forEach(b=>{
    const a=(b.assign&&b.assign[shift])||{};
    DAYS.forEach(d=>{ if(a[d]===name) delete a[d]; });
  });

  /* 3) 종료일 없는 행 → 요일 패턴 (시작일은 4단계에서 처리) */
  const startOf={};
  ongoingRows(rows).forEach(r=>{
    r.floors.forEach(id=>{
      const b=S.buildings.find(x=>x.id===id); if(!b) return;
      if(!b.assign) b.assign={주간:{},야간:{}};
      const a=b.assign[shift]=b.assign[shift]||{};
      r.dows.forEach(d=>{
        a[d]=name;
        const key=id+'|'+d, cur=startOf[key];
        const from=r.from||'';
        startOf[key] = (cur===undefined)? from : (from&&cur? (from<cur?from:cur) : '');
      });
    });
  });

  /* 4) 시작일 이전 + 담당에서 빠진 자리 → 이전 값을 날짜별로 되살림 */
  let frozen=0;
  months.forEach(m=>monthDates(m).forEach(d=>{
    S.buildings.forEach(b=>{
      const a=(b.assign&&b.assign[shift])||{};
      const mine=a[d.dow]===name;
      const start = mine ? (startOf[b.id+'|'+d.dow] || eff || '') : (eff||'');
      const prev = before[d.date+'|'+b.id]||'';
      const now = mine? name : (a[d.dow]||'');
      if(prev===now) return;
      if(start && d.date>=start) return;      /* 적용일 이후는 새 배치가 맞음 */
      const key=ovKey(d.date,b.id,shift);
      if(S.overrides[key]===undefined){
        S.overrides[key]=prev;            /* 비어 있었으면 그대로 빈칸 유지 */
        S.dutyOv[key]=s.id; frozen++;
      }
    });
  }));

  /* 5) 종료일 있는 행 → 해당 날짜에만 기록 */
  const keys=[]; let dated=0;
  datedRows(rows).forEach(r=>{
    const from=r.from || (S.payMonth+'-01');
    eachDate(from, r.to, (date,dow)=>{
      if(!r.dows.includes(dow)) return;
      r.floors.forEach(id=>{
        const key=ovKey(date,id,shift);
        S.overrides[key]=name; S.dutyOv[key]=s.id; keys.push(key); dated++;
      });
    });
  });
  s.dutyKeys=keys;

  const set=Object.keys(startOf).length;
  return {set, frozen, dated, swept};
}

function billMonth(ym){
  const [y,m]=ym.split('-').map(Number);
  const d=new Date(y,m,1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

function renameRegion(i,v){
  const old=S.regions[i]; v=v.trim()||old;
  S.buildings.forEach(b=>{if(b.region===old)b.region=v}); S.staff.forEach(s=>{if(s.region===old)s.region=v});
  S.regions[i]=v; if(F.region===old)F.region=v; save(); renderSet();
}
function delRegion(i){
  const r=S.regions[i];
  if(S.buildings.some(b=>b.region===r)||S.staff.some(s=>s.region===r)){ alert('해당 지점에 등록된 건물 또는 인원이 있어 삭제할 수 없습니다.'); return; }
  S.regions.splice(i,1); save(); renderSet();
}

  S.buildings.forEach(b=>['주간','야간'].forEach(sh=>{
    const a=(b.assign&&b.assign[sh])||{};

  S.staff.forEach(s=>{ if(s.vendorId===id) s.vendorId=''; });

/* ============ 클라우드 동기화 ============ */
const CLOUD_DEFAULT={url:'https://ugwzyxsynpvnbbsqlcqq.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnd3p5eHN5bnB2bmJic3FsY3FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNjA3NDIsImV4cCI6MjA5OTYzNjc0Mn0.DswVM1dtfaEgRujb0mZpDPXTEb7xdeOAnVuRKKdQtlE',doc:'sidae-cleaning',on:true};
const CS={state:'off', dirty:false, lastEdit:0, rev:0, at:null, msg:'', me:Math.random().toString(36).slice(2,9), busy:false, busySince:0, queued:false, lastJson:null};
const SQL_SETUP=`create table if not exists fm_sync (
  key         text primary key,
  data        jsonb not null,
  rev         bigint not null default 0,
  updated_by  text,
  updated_at  timestamptz not null default now()
);
alter table fm_sync enable row level security;
create policy "anon rw" on fm_sync
  for all to anon using (true) with check (true);`;

function pushNow(){ clearTimeout(pushTimer); if(cloudReady()) cloudPush(true); }
function cloudReady(){ if(!S) return false; const c=S.cloud||{}; return c.on && c.url && c.key && c.doc; }
function baseUrl(u){ return String(u||'').trim().replace(/\/+$/,'').replace(/\/rest\/v1$/,''); }
function api(path, opts){
  const c=S.cloud;
  return fetch(baseUrl(c.url)+'/rest/v1/'+path, Object.assign({
    headers:{ 'apikey':c.key, 'Authorization':'Bearer '+c.key, 'Content-Type':'application/json' }
  }, opts||{}));
}
function paintSync(){
  const bar=document.getElementById('syncbar'); if(!bar||!S) return;
  const c=S.cloud||{};
  const cls={off:'',busy:'busy',ok:'ok',err:'err'}[CS.state]||'';
  const label={off:'로컬 저장만', busy:'동기화 중', ok:'동기화됨', err:'동기화 오류'}[CS.state]||'';
  const cnt=`${S.buildings.length}개 층 · ${S.staff.length}명 · ${(S.vendors||[]).length}개 업체`;
  bar.innerHTML=`<b>시대인재 미화 운영</b><span class="sep">·</span><span>${cnt}</span>
    <span class="sep">·</span>
    <span class="sname">${cloudReady()?'공유 클라우드 저장(Supabase)':'이 브라우저에만 저장'}</span>
    <span class="sep">·</span><span class="sdot ${cls}"></span>
    <span>${CS.dirty&&CS.state!=='err'?'저장 중…':label}</span>
    ${CS.at?`<span class="sep">·</span><span>최신 ${CS.at}</span>`:''}
    ${CS.msg?`<span class="sep">·</span><span style="color:#C0392B">${esc(CS.msg)}</span>
      <button class="sbtn" onclick="cloudPull(true)">다시 시도</button>`:''}`;
}
function stamp(){ CS.at=new Date().toLocaleTimeString('ko-KR',{hour12:false}); }

function pack(){ const o=JSON.parse(JSON.stringify(S)); delete o.cloud; delete o._rev; return o; }
function canon(v){
  if(Array.isArray(v)) return v.map(canon);
  if(v && typeof v==='object'){ const o={}; Object.keys(v).sort().forEach(k=>o[k]=canon(v[k])); return o; }
  return v;
}
function cjson(o){ try{ return JSON.stringify(canon(o)); }catch(e){ return null; } }
function snapshotJson(){ return cjson(pack()); }
function detectChange(){
  if(!S) return;
  const j=snapshotJson(); if(j===null) return;
  if(CS.lastJson===null){ CS.lastJson=j; return; }
  if(j!==CS.lastJson){ CS.lastJson=j; CS.dirty=true; CS.lastEdit=Date.now(); paintSync(); }
}
function adopt(data){
  const cloud=S.cloud;
  S=Object.assign(data,{cloud});
  _idx.map=null;
  const t=TAB; render(); TAB=t;
}
async function cloudPull(force){
  if(!cloudReady()||CS.busy) return;
  if(CS.state==='off') CS.state='busy';
  CS.busySince=Date.now();
  CS.busy=true;
  try{
    const r=await api(`${encodeURIComponent('fm_sync')}?key=eq.${encodeURIComponent(S.cloud.doc)}&select=rev,data,updated_by,updated_at`);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows=await r.json();
    if(!rows.length){ CS.state='ok'; CS.msg=''; stamp(); if(force) await cloudPush(true); }
    else{
      const row=rows[0], remoteJson=cjson(row.data), same=(remoteJson===snapshotJson());
      if(same){
        CS.rev=Math.max(CS.rev,row.rev); CS.lastJson=remoteJson;
        if(S._rev!==CS.rev){ S._rev=CS.rev; saveLocal(); }
        CS.dirty=false;
      }else if(row.rev>CS.rev || force){
        CS.rev=row.rev; CS.lastJson=remoteJson;
        adopt(row.data); S._rev=row.rev; CS.dirty=false;
        if(row.updated_by!==CS.me && !force) toast('다른 기기의 변경사항을 불러왔습니다');
      }else{
        CS.rev=Math.max(CS.rev,row.rev);
        CS.dirty=true; CS.lastEdit=Date.now()-2000;
      }
      CS.state='ok'; CS.msg=''; stamp();
    }
  }catch(e){ CS.state='err'; CS.msg=String(e.message||e).slice(0,60); }
  CS.busy=false; paintSync();
  if(CS.queued||CS.dirty){ CS.queued=false; setTimeout(()=>cloudPush(true),120); }
}
async function cloudPush(silent){
  if(!cloudReady()) return;
  if(CS.busy){ CS.queued=true; return; }
  const token=CS.lastEdit;
  CS.busy=true; CS.busySince=Date.now(); CS.state='busy'; paintSync();
  try{
    const body=[{key:S.cloud.doc, data:pack(), rev:CS.rev+1, updated_by:CS.me, updated_at:new Date().toISOString()}];
    const r=await api('fm_sync?on_conflict=key',{method:'POST',
      headers:{'apikey':S.cloud.key,'Authorization':'Bearer '+S.cloud.key,'Content-Type':'application/json',
               'Prefer':'resolution=merge-duplicates,return=representation'},
      body:JSON.stringify(body)});
    if(!r.ok) throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,50));
    const out=await r.json();
    CS.rev=(out[0]&&out[0].rev)||CS.rev+1;
    if(CS.lastEdit===token) CS.dirty=false;
    S._rev=CS.rev; CS.lastJson=snapshotJson(); saveLocal();
    CS.state='ok'; CS.msg=''; stamp();
    if(!silent) toast('클라우드에 저장했습니다');
  }catch(e){ CS.state='err'; CS.msg=String(e.message||e).slice(0,60); }
  CS.busy=false; paintSync();
  if(CS.queued){ CS.queued=false; setTimeout(()=>cloudPush(true),100); }
}
setInterval(()=>{
  detectChange();
  if(!cloudReady()) return;
  if(CS.busy){
    if(Date.now()-(CS.busySince||0)>10000){ CS.busy=false; CS.state='err'; CS.msg='응답 지연 — 재시도'; paintSync(); }
    return;
  }
  if(CS.dirty && Date.now()-CS.lastEdit>1200) cloudPush(true);
  else if(!CS.dirty) cloudPull(false);
}, 2500);
window.addEventListener('online',()=>{ if(cloudReady()) cloudPull(false); });
window.addEventListener('focus',()=>{ if(cloudReady()&&!CS.dirty) cloudPull(false); });
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && cloudReady() && !CS.dirty) cloudPull(false);
});

  const g=k=>document.getElementById('c_'+k).value.trim();

function discardDraft(){
  if(!_draft) return;
  const d=_draft; _draft=null; let removed=false;
  if(d.kind==='staff'){
    const s=S.staff.find(x=>x.id===d.id);
    if(s && !String(s.name||'').trim()){ S.staff=S.staff.filter(x=>x.id!==d.id); removed=true; }
  }else if(d.kind==='building'){
    const b=S.buildings.find(x=>x.id===d.id);
    if(b && !String(b.building||'').trim() && !String(b.gwan||'').trim() && !String(b.floor||'').trim()){
      S.buildings=S.buildings.filter(x=>x.id!==d.id); removed=true; }
  }else if(d.kind==='vendor'){
    const v=S.vendors.find(x=>x.id===d.id);
    if(v && !String(v.name||'').trim()){ S.vendors=S.vendors.filter(x=>x.id!==d.id); removed=true; }
  }
  if(removed){ _pendingAssign=null; saveLocal(); render(); }
}
