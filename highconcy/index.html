<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하이컨시 청소 담당자 배정 v4</title>
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=ee1f4030a4720b67a4498a9d87ee6064&libraries=services"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f2f5;color:#1a1d2e;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;height:100vh;overflow:hidden}
#app{display:grid;grid-template-columns:380px 1fr;grid-template-rows:54px 40px 1fr;height:100vh}

/* HEADER */
#header{grid-column:1/-1;background:#1a1d2e;display:flex;align-items:center;padding:0 18px;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#header h1{font-size:14px;font-weight:700;color:#fff}
.hbadge{background:#03c75a;color:#fff;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:700}
.hspace{flex:1}
#hstat{font-size:11px;color:#aaa}
#btn-print{background:#1a73e8;border:none;color:#fff;padding:6px 14px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer}
#btn-print:hover{background:#1557b0}

/* SCHEDULE TAB BAR — full width */
#sched-bar{grid-column:1/-1;background:#fff;border-bottom:2px solid #e2e5ef;display:flex;align-items:stretch;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;flex-wrap:nowrap}
.sched-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700;color:#888;cursor:pointer;border-bottom:3px solid transparent;padding:0 2px;transition:all .15s;position:relative;min-width:0;white-space:nowrap}
.sched-tab:hover{color:#1a1d2e;background:#f8f9fc}
.sched-tab.active{color:#fff;border-bottom-color:transparent}
.sched-tab[data-sch="전체"].active{background:#1a1d2e;color:#fff}
.sched-tab[data-sch="주간"].active{background:#1a73e8;color:#fff}
.sched-tab[data-sch="야간"].active{background:#7c3aed;color:#fff}
.sched-tab[data-sch="월"].active{background:#555;color:#fff}
.sched-tab[data-sch="화"].active{background:#555;color:#fff}
.sched-tab[data-sch="수"].active{background:#555;color:#fff}
.sched-tab[data-sch="목"].active{background:#555;color:#fff}
.sched-tab[data-sch="금"].active{background:#555;color:#fff}
.sched-tab[data-sch="토"].active{background:#555;color:#fff}
.sched-tab[data-sch="일"].active{background:#555;color:#fff}
.sched-count{font-size:9px;background:rgba(255,255,255,.25);padding:1px 4px;border-radius:8px;font-weight:600}
.sched-tab:not(.active) .sched-count{background:#f0f2f8;color:#888}

/* SIDEBAR */
#sidebar{background:#fff;border-right:1px solid #e2e5ef;display:flex;flex-direction:column;overflow:hidden}
#tabs{display:flex;border-bottom:1px solid #e2e5ef;background:#f8f9fc}
.tab{flex:1;padding:10px 6px;text-align:center;font-size:12px;font-weight:600;color:#888;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:#1a73e8;border-bottom-color:#1a73e8;background:#fff}

/* FILTER + LIMIT */
#filter-bar{padding:8px 10px;border-bottom:1px solid #e8eaf0;display:flex;gap:5px;flex-wrap:wrap;background:#f8f9fc}
.fbtn{background:#fff;border:1px solid #dde1f0;color:#555;padding:3px 10px;border-radius:20px;font-size:11px;cursor:pointer;font-weight:600;transition:all .15s}
.fbtn.active{color:#fff;border-color:transparent}
.fbtn[data-s="전체"].active{background:#1a1d2e}
.fbtn[data-s="대치"].active{background:#1a73e8}
.fbtn[data-s="목동"].active{background:#e8710a}
.fbtn[data-s="대전"].active{background:#7c3aed}
.fbtn[data-s="기타"].active{background:#0891b2}
#limit-bar{padding:6px 10px;background:#fffbf0;border-bottom:1px solid #f0e9cc;display:flex;align-items:center;gap:6px;font-size:11px;color:#7a6000}
#limit-bar strong{color:#b45309}
#limit-input{width:55px;border:1px solid #e0c96d;border-radius:4px;padding:2px 5px;font-size:11px;text-align:center;background:#fffef5}

/* BUILDING LIST */
#building-list{flex:1;overflow-y:auto;padding:8px}
#building-list::-webkit-scrollbar{width:4px}
#building-list::-webkit-scrollbar-thumb{background:#d0d5e8;border-radius:4px}

.bld-card{background:#fff;border:1px solid #e4e7f4;border-radius:9px;margin-bottom:6px;overflow:hidden;cursor:pointer;transition:border .15s;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.bld-card:hover{border-color:#1a73e8}
.bld-header{display:flex;align-items:center;padding:8px 10px;gap:8px}
.bld-color-bar{width:5px;height:36px;border-radius:3px;flex-shrink:0}
.bld-info{flex:1;min-width:0}
.bld-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bld-sub{font-size:10px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.bld-area-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;flex-shrink:0}
.bld-assign{padding:5px 10px 8px 23px;border-top:1px solid #f0f2f8;background:#fafbfe}

/* floor rows — grid layout */
.floor-row{display:grid;grid-template-columns:60px 28px 14px repeat(7,1fr) 14px repeat(7,1fr);align-items:center;gap:2px;font-size:9px;padding:2px 0;border-bottom:1px dotted #eee}
.floor-row:last-child{border:none}
.floor-label{color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}
.floor-area{color:#1a73e8;font-weight:700;font-size:10px}
.sched-cell select{width:100%;background:#fff;border:1px solid #dde1f0;color:#333;border-radius:4px;padding:2px 2px;font-size:10px}
.sched-cell select:focus{outline:none;border-color:#1a73e8}
.sched-cell select.assigned{font-weight:700}

/* 스케줄 컬럼 헤더 */
.floor-header{font-size:9px;font-weight:700;color:#aaa;margin-bottom:2px;border-bottom:1px solid #e8eaf0}
.floor-grid-row{display:grid;grid-template-columns:72px 32px repeat(7,1fr) repeat(7,1fr);gap:2px;align-items:center}
.floor-hdr-row{display:grid;grid-template-columns:60px 28px 14px repeat(7,1fr) 14px repeat(7,1fr);gap:2px;align-items:center;padding:3px 0 2px;border-bottom:1px solid #e8eaf0;margin-bottom:2px}
/* 탭별 컬럼 숨기기 */
body.view-주간 .shift-야간{display:none!important}
body.view-주간 .floor-row{grid-template-columns:60px 28px 14px repeat(7,1fr)!important}
body.view-주간 .floor-hdr-row{grid-template-columns:60px 28px 14px repeat(7,1fr)!important}
body.view-야간 .shift-주간{display:none!important}
body.view-야간 .floor-row{grid-template-columns:60px 28px 14px repeat(7,1fr)!important}
body.view-야간 .floor-hdr-row{grid-template-columns:60px 28px 14px repeat(7,1fr)!important}
.floor-hdr-label{font-size:9px;font-weight:700;color:#888}
.floor-hdr-area{font-size:9px;font-weight:700;color:#aaa;text-align:center}
.floor-hdr-shift{font-size:10px;font-weight:800;text-align:center}
.pop-grid-row{display:grid;grid-template-columns:55px 28px repeat(7,1fr) repeat(7,1fr);gap:2px;align-items:center}
.sh-월{color:#1a73e8}
.sh-화{color:#7c3aed}
.sh-수{color:#03c75a}
.sh-목{color:#e8710a}
.sh-금{color:#e8375a}
.sh-토{color:#0891b2}
.sh-일{color:#ca8a04}

/* STAFF PANEL */
#staff-panel{flex:1;overflow-y:auto;padding:10px;display:none}
#staff-panel.show{display:block}
.staff-card{background:#fff;border:1px solid #e4e7f4;border-radius:9px;padding:10px 12px;margin-bottom:8px}
.staff-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.staff-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.staff-name-in{flex:1;background:#f4f6fc;border:1px solid #dde1f0;color:#1a1d2e;border-radius:5px;padding:4px 8px;font-size:12px;font-weight:700}
.staff-name-in:focus{outline:none;border-color:#1a73e8}
.staff-meta{font-size:11px;color:#888;white-space:nowrap}
.btn-del{background:none;border:none;color:#dc2626;cursor:pointer;font-size:16px;padding:0 2px}
.area-gauge-track{height:6px;background:#e8eaf0;border-radius:3px;overflow:hidden;margin-bottom:3px}
.area-gauge-fill{height:100%;border-radius:3px;transition:width .3s}
.area-gauge-labels{display:flex;justify-content:space-between;font-size:10px;color:#888;margin-bottom:6px}
.area-gauge-labels .over{color:#dc2626;font-weight:700}
/* 스케줄별 breakdown */
.sched-breakdown{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:6px}
.sched-box{border-radius:6px;padding:5px 8px;font-size:10px}
.sched-box-label{font-weight:700;margin-bottom:1px}
.sched-box-val{font-size:12px;font-weight:800}
.staff-list-items{font-size:10px;color:#555;line-height:1.7}
.staff-list-item{display:flex;gap:4px;align-items:baseline}
.btn-add-staff{width:100%;background:#f4f6fc;border:1.5px dashed #c4cbdf;color:#666;padding:8px;border-radius:9px;font-size:12px;cursor:pointer;font-weight:600}
.btn-add-staff:hover{border-color:#1a73e8;color:#1a73e8}

/* MAP */
#map-wrap{position:relative}
#map{width:100%;height:100%}

/* ROUTE CTRL */
#route-ctrl{position:absolute;top:10px;right:10px;z-index:1000;background:#fff;border:1px solid #e2e5ef;border-radius:10px;padding:12px 14px;min-width:200px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
#route-ctrl h3{font-size:12px;font-weight:700;margin-bottom:8px}
.rstaff-item{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:11px;cursor:pointer}
.rstaff-item input{accent-color:#1a73e8;width:13px;height:13px}
.rdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.rcount{font-size:10px;color:#999;margin-left:auto}
#btn-opt{width:100%;background:#1a73e8;border:none;color:#fff;padding:7px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;margin-top:6px}
#btn-opt:hover{background:#1557b0}

/* STATS BAR */
#stats-bar{position:absolute;bottom:0;left:0;right:0;z-index:900;background:rgba(255,255,255,.94);border-top:1px solid #e2e5ef;padding:5px 14px;display:flex;gap:16px;align-items:center;font-size:11px}
.stat{display:flex;gap:5px;align-items:center;color:#555}
.stat-val{font-weight:700;font-size:13px;color:#1a1d2e}
#rinfo{margin-left:auto;color:#1a73e8;font-weight:700;font-size:12px}

/* LEGEND */
#legend{position:absolute;bottom:38px;left:10px;z-index:900;background:#fff;border:1px solid #e2e5ef;border-radius:8px;padding:8px 12px;font-size:11px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.leg-item{display:flex;align-items:center;gap:6px;margin-bottom:3px;color:#333}
.leg-dot{width:10px;height:10px;border-radius:3px}

/* MARKER */
.cmarker{display:flex;align-items:center;justify-content:center;border-radius:6px;color:#fff;font-weight:700;font-size:9px;border:2px solid rgba(255,255,255,.9);box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer}
.cmarker.unassigned{background:#b0b8cc}
.cmarker.over-limit{animation:pulse-warn 1.2s infinite}
@keyframes pulse-warn{0%,100%{box-shadow:0 0 0 3px #dc2626}50%{box-shadow:0 0 0 6px rgba(220,38,38,.4)}}

/* POPUP */

.popup-inner{padding:10px 12px;min-width:420px}
.pop-title{font-size:13px;font-weight:800;margin-bottom:2px}
.pop-addr{font-size:10px;color:#888;margin-bottom:7px}
.bld-mgmt-card{background:#fff;border:1px solid #e2e5ef;border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.bld-mgmt-card .bm-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.bld-mgmt-card .bm-name{font-weight:700;font-size:13px;color:#1a1d2e;}
.bld-mgmt-card .bm-sub{font-size:11px;color:#888;margin-top:1px;}
.bm-field{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.bm-field label{font-size:10px;font-weight:700;color:#888;width:32px;flex-shrink:0;}
.bm-field input{flex:1;padding:4px 7px;border:1px solid #d0d5e8;border-radius:5px;font-size:12px;color:#1a1d2e;background:#f8f9fc;}
.bm-field input:focus{border-color:#1a73e8;outline:none;background:#fff;}
.bm-actions{display:flex;gap:6px;margin-top:8px;}
.bm-btn{padding:4px 10px;border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;}
.bm-btn.save{background:#1a73e8;color:#fff;}
.bm-btn.save:hover{background:#1557b0;}
.bm-btn.del{background:#fee2e2;color:#dc2626;}
.bm-btn.del:hover{background:#fecaca;}
.bm-btn.cancel{background:#f1f3f9;color:#666;}
#bld-panel{flex:1;overflow-y:auto;padding:8px;display:none;}
#bld-panel.show{display:block;}
#bld-panel .bm-search{width:100%;padding:7px 10px;border:1px solid #d0d5e8;border-radius:7px;font-size:12px;margin-bottom:8px;outline:none;color:#1a1d2e;background:#f8f9fc;}
.bulk-bar{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#f8f9fc;border-radius:6px;margin-bottom:6px;flex-wrap:wrap}
.bulk-bar select{padding:3px 6px;border:1px solid #d0d5e8;border-radius:5px;font-size:11px;color:#1a1d2e;background:#fff}
.bulk-btn{padding:3px 10px;background:#1a73e8;color:#fff;border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.bulk-btn:hover{background:#1557b0}
.bulk-btn.clear{background:#f1f3f9;color:#666}
.bulk-btn.clear:hover{background:#e2e5ef}
.pop-floor-header{font-size:9px;font-weight:700;color:#aaa;margin-bottom:3px;border-bottom:1px solid #eee;padding-bottom:3px}
.pop-hdr-row{display:grid;grid-template-columns:50px 26px 12px repeat(7,1fr) 12px repeat(7,1fr);gap:2px;align-items:center}
.pop-floor{display:grid;grid-template-columns:50px 26px 12px repeat(7,1fr) 12px repeat(7,1fr);gap:2px;font-size:9px;padding:2px 0;border-bottom:1px dotted #eee;align-items:center}
.pop-floor:last-child{border:none}
.pop-fl-name{color:#666;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-fl-area{color:#1a73e8;font-weight:700}
.pop-fl-staff{font-weight:700;text-align:center;font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* PRINT */
@media print{
  body{background:#fff;overflow:auto;height:auto}
  #app{display:none}
  #print-overlay{display:block !important}
}
#print-overlay{display:none;position:fixed;inset:0;background:#fff;z-index:9999;overflow:auto}
#print-overlay.show{display:block}
.print-page{width:210mm;min-height:297mm;padding:12mm 13mm 10mm;margin:0 auto;background:#fff;font-family:'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif}
.print-logo-row{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.print-logo{font-size:18px;font-weight:900;color:#03c75a}
.print-title{font-size:16px;font-weight:800;color:#1a1d2e}
.print-date{font-size:10px;color:#888;margin-left:auto}
.print-sched-label{font-size:12px;font-weight:700;padding:3px 12px;border-radius:20px;color:#fff;margin-left:8px}
.print-divider{border:none;border-top:2px solid #1a73e8;margin:7px 0 10px}
.print-summary{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.print-sum-box{background:#f4f6fc;border-radius:7px;padding:7px 10px;text-align:center}
.print-sum-label{font-size:9px;color:#888;margin-bottom:2px}
.print-sum-val{font-size:15px;font-weight:800;color:#1a1d2e}
.print-sum-unit{font-size:9px;color:#888}
.print-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.print-staff-block{border:1px solid #dde1f0;border-radius:8px;overflow:hidden;break-inside:avoid}
.psb-header{padding:7px 12px;display:flex;align-items:center;gap:8px;color:#fff}
.psb-header-name{font-size:13px;font-weight:800}
.psb-header-meta{font-size:10px;margin-left:auto;opacity:.9}
.psb-gauge{height:3px;background:rgba(255,255,255,.3)}
.psb-gauge-fill{height:100%;background:rgba(255,255,255,.8)}
.psb-body{padding:7px 12px}
.psb-row{display:flex;align-items:center;gap:5px;padding:3px 0;border-bottom:1px dotted #eee;font-size:10px}
.psb-row:last-child{border:none}
.psb-num{width:16px;font-weight:700;color:#888;flex-shrink:0}
.psb-guan{font-weight:700;color:#1a1d2e;min-width:55px}
.psb-bld{color:#666;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psb-area{color:#1a73e8;font-weight:700;margin-left:auto;flex-shrink:0}
.psb-floors{color:#999;font-size:9px;white-space:nowrap}
.print-close-btn{position:fixed;top:16px;right:16px;z-index:10000;background:#dc2626;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer}
.print-act-btn{position:fixed;top:16px;right:120px;z-index:10000;background:#1a73e8;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <!-- HEADER -->
  <header id="header">
    <span style="font-size:20px">🧹</span>
    <h1>하이컨시 청소 담당자 배정 시스템</h1>
    <span class="hbadge">시대인재</span>
    <div class="hspace"></div>
    <span id="hstat"></span><span style="display:flex;align-items:center;gap:5px;margin-left:12px;"><span id="sbDot" style="width:7px;height:7px;border-radius:50%;background:#666;flex-shrink:0;"></span><span id="sbStatus" style="font-size:11px;color:#aaa;">연결 중...</span></span>
    <button id="btn-print" onclick="openPrint()">🖨️ A4 출력</button>
    <button id="btn-excel" onclick="downloadExcel()" style="background:#1d6f42;border:none;color:#fff;padding:6px 14px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;margin-left:6px;">📊 엑셀 다운로드</button>
  </header>

  <!-- SCHEDULE TAB BAR -->
  <div id="sched-bar">
    <div class="sched-tab active" data-sch="전체" onclick="switchSched('전체',this)">
      <span>📋 종합</span><span class="sched-count" id="sc-전체">0</span>
    </div>
    <div class="sched-tab" data-sch="주간" onclick="switchSched('주간',this)">
      <span>☀️ 주간</span><span class="sched-count" id="sc-주간">0</span>
    </div>
    <div class="sched-tab" data-sch="야간" onclick="switchSched('야간',this)">
      <span>🌙 야간</span><span class="sched-count" id="sc-야간">0</span>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="tabs">
      <div class="tab active" onclick="switchTab(0)">🏢 건물 배정</div>
      <div class="tab" onclick="switchTab(1)">👥 담당자 관리</div>
      <div class="tab" onclick="switchTab(2)">⚙️ 건물 관리</div>
    </div>
    <div id="search-bar" style="padding:8px 10px;border-bottom:1px solid #e2e5ef;">
      <div style="position:relative;">
        <input id="bld-search" type="text" placeholder="🔍 건물명 / 관명 검색..."
          oninput="filterSearch(this.value)"
          style="width:100%;padding:7px 30px 7px 10px;border:1px solid #d0d5e8;border-radius:7px;font-size:12px;background:#f8f9fc;outline:none;color:#1a1d2e;">
        <span id="search-clear" onclick="clearSearch()" style="display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);cursor:pointer;color:#aaa;font-size:14px;">✕</span>
      </div>
    </div>
    <div id="filter-bar">
      <button class="fbtn active" data-s="전체" onclick="filterSheet('전체',this)">전체</button>
      <button class="fbtn" data-s="대치" onclick="filterSheet('대치',this)">대치</button>
      <button class="fbtn" data-s="목동" onclick="filterSheet('목동',this)">목동</button>
      <button class="fbtn" data-s="대전" onclick="filterSheet('대전',this)">대전</button>
      <button class="fbtn" data-s="기타" onclick="filterSheet('기타',this)">기타</button>
    </div>
    <div id="limit-bar">
      ⚠️ 1인당 최대:&nbsp;
      <input id="limit-input" type="number" value="400" min="100" max="2000" step="50" onchange="areaLimit=+this.value;renderAll()">
      &nbsp;<strong>평</strong>

// ===== ASSIGNMENT HELPERS =====
function getAss(bldId,fi,sch){
  return (assignments[bldId]&&assignments[bldId][fi]&&assignments[bldId][fi][sch])||0;
}
function setAss(bldId,fi,sch,sid){
  if(!assignments[bldId]) assignments[bldId]={};
  if(!assignments[bldId][fi]) assignments[bldId][fi]={};
  if(sid) assignments[bldId][fi][sch]=parseInt(sid);
  else delete assignments[bldId][fi][sch];
  sbSaveAssignment(bldId, fi, sch, sid ? parseInt(sid) : null);
}

// 스케줄 필터에서 보여줄 담당자 결정
// 전체 모드: 스케줄 중 하나라도 배정된 담당자 → 대표색 (첫번째 배정 스케줄 색상 혼합)
function getMarkerColor(bld){
  const scheds = currentSched==='전체' ? SCHEDS : [currentSched];
  const sids=new Set();
  bld.층들.forEach((f,fi)=>{
    scheds.forEach(sch=>{ const s=getAss(bld.id,fi,sch); if(s) sids.add(s); });
  });
  if(sids.size===0) return '#b0b8cc';
  if(sids.size===1){const s=staffList.find(x=>x.id==[...sids][0]);return s?s.color:'#b0b8cc';}
  return '#555';
}

// 담당자별 스케줄별 면적
function getStaffSchedArea(sid,sch){
  let total=0;
  BDATA.forEach(b=>{
    b.층들.forEach((f,fi)=>{ if(getAss(b.id,fi,sch)==sid) total+=f.면적; });
  });
  return Math.round(total);
}
function getStaffTotalArea(sid){
  // 스케줄별 합산 (중복 층 있을 수 있어서 스케줄별로 별도 집계)
  return SCHEDS.reduce((s,sch)=>s+getStaffSchedArea(sid,sch),0);
}
// 현재 뷰 기준 담당자 면적
function getStaffViewArea(sid){
  const actScheds=getActiveScheds();
  if(actScheds===SCHEDS) return getStaffTotalArea(sid);
  return actScheds.reduce((s,sch)=>s+getStaffSchedArea(sid,sch),0);
}

// 담당자가 배정된 건물 포인트 (현재 스케줄 기준)
function getStaffPoints(sid){
  const pts=[];const seen=new Set();
  const scheds=getActiveScheds();
  BDATA.forEach(b=>{
    const hit=b.층들.some((f,fi)=>scheds.some(sch=>getAss(b.id,fi,sch)==sid));
    if(hit&&!seen.has(b.id)){seen.add(b.id);pts.push(b);}
  });
  return pts;
}

// 스케줄별 총 배정 수 (count badge)
function getSchedCount(sch){
  let n=0;
  BDATA.forEach(b=>{
    b.층들.forEach((f,fi)=>{ if(getAss(b.id,fi,sch)) n++; });
  });
  return n;
}

  });

// 같은 좌표(건물) 기준으로 BDATA 그룹핑
function getBuildingGroups(){
  const groups={};
  BDATA.forEach(bld=>{
    if(!visible(bld)) return;
    const key=`${bld.lat},${bld.lng}`;
    if(!groups[key]) groups[key]={lat:bld.lat,lng:bld.lng,items:[],sheet:bld.sheet,건물명:bld.건물명};
    groups[key].items.push(bld);
  });
  return Object.values(groups);
}

const 구분COLOR={'단과':'#1a73e8','재종':'#e8710a','사무실':'#16a34a','컨텐츠':'#7c3aed'};

function getGroupColor(items){
  const scheds=getActiveScheds();
  const sids=new Set();
  items.forEach(bld=>{
    bld.층들.forEach((f,fi)=>{
      scheds.forEach(sch=>{ const s=getAss(bld.id,fi,sch); if(s) sids.add(s); });
    });
  });
  if(sids.size===0){const g=items[0]?.구분||'단과';return 구분COLOR[g]||'#b0b8cc';}
  if(sids.size===1){const s=staffList.find(x=>x.id==[...sids][0]);return s?s.color:'#b0b8cc';}
  return '#555';
}

function renderMarkers(){
  Object.values(markers).forEach(m=>m.setMap(null));
  markers={};
  const groups=getBuildingGroups();
  groups.forEach(grp=>{
    const color=getGroupColor(grp.items);
    const scheds=getActiveScheds();
    const sids=new Set(grp.items.flatMap(bld=>bld.층들.flatMap((f,fi)=>scheds.map(sch=>getAss(bld.id,fi,sch)))).filter(Boolean));
    const isOver=[...sids].some(sid=>getStaffViewArea(sid)>areaLimit);
    const label=grp.items.length>1
      ? (grp.건물명||grp.items[0].관명).slice(0,3)
      : grp.items[0].관명.slice(0,3);
    const badge=grp.items.length>1?`<span style="position:absolute;top:-6px;right:-6px;background:#fff;color:#333;border-radius:50%;width:14px;height:14px;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1px solid #ccc">${grp.items.length}</span>`:'';
    const 구분 = grp.items[0]?.구분||'단과';
    const 구분Colors = {'단과':'#1a73e8','재종':'#e8710a','사무실':'#16a34a','컨텐츠':'#7c3aed'};
    const borderColor = 구분Colors[구분]||'#999';
    // 배정된 담당자가 있으면 바탕=담당자색, 테두리=구분색
    // 미배정이면 바탕=흰색(연한), 테두리=구분색
    const isAssigned = sids.size > 0;
    const bgColor = isAssigned ? color : 'rgba(255,255,255,0.85)';
    const textColor = isAssigned ? '#fff' : borderColor;
    const borderStyle = `3px solid ${borderColor}`;
    const el=document.createElement('div');
    const grpIdx = Object.keys(window._markerGroups).length;
    window._markerGroups[grpIdx] = {grp, lat:grp.lat, lng:grp.lng};

    const pos = new kakao.maps.LatLng(grp.lat, grp.lng);
    el.style.cssText='position:relative;cursor:pointer;';
    el.innerHTML=`<div class="cmarker${isOver?' over-limit':''}" style="background:${bgColor};border:${borderStyle};color:${textColor};width:30px;height:30px;" onclick="window.handleMarkerClick(${grpIdx})"><span>${label}</span></div>${badge}`;
    const overlay = new kakao.maps.CustomOverlay({position:pos, content:el, yAnchor:0.5});
    overlay.setMap(map);
    grp.items.forEach(bld=>{ markers[bld.id]=overlay; });
  });
  renderRoutes();
  updateStats();
  renderLegend();
}

function updateMarkerColor(bldId){
  renderMarkers();
}

// ===== ROUTES =====
function renderRoutes(){
  routeLayers.forEach(l=>l.setMap(null));
  routeLayers=[];
  staffList.forEach(s=>{
    if(!visibleRoutes[s.id]) return;
    const pts=getStaffPoints(s.id);
    if(pts.length<2) return;
    const line=new kakao.maps.Polyline({
      path: pts.map(p=>new kakao.maps.LatLng(p.lat,p.lng)),
      strokeColor: s.color, strokeWeight:3, strokeOpacity:.85, strokeStyle:'dashed'
    });
    line.setMap(map);
    routeLayers.push(line);
  });
}

function optimizeRoute(){
  const s=staffList.find(s=>visibleRoutes[s.id]&&getStaffPoints(s.id).length>1);
  if(!s){alert('동선을 표시할 담당자를 선택해 주세요.');return;}
  const pts=getStaffPoints(s.id);
  const opt=[pts[0]];const rem=pts.slice(1);
  while(rem.length){
    const last=opt[opt.length-1];let ni=0,md=Infinity;
    rem.forEach((p,i)=>{const d=Math.hypot(p.lat-last.lat,p.lng-last.lng);if(d<md){md=d;ni=i;}});
    opt.push(rem.splice(ni,1)[0]);
  }
  routeLayers.forEach(l=>l.setMap(null));routeLayers=[];
  const line=new kakao.maps.Polyline({
    path:opt.map(p=>new kakao.maps.LatLng(p.lat,p.lng)),
    strokeColor:s.color,strokeWeight:4,strokeOpacity:.9
  });
  line.setMap(map);routeLayers.push(line);
  const bounds=new kakao.maps.LatLngBounds();
  opt.forEach((p,i)=>{
    const pos=new kakao.maps.LatLng(p.lat,p.lng);
    bounds.extend(pos);
    const el=document.createElement('div');
    el.style.cssText=`background:${s.color};color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:2px solid white;box-shadow:0 2px 5px rgba(0,0,0,.3)`;
    el.textContent=i+1;
    const ov=new kakao.maps.CustomOverlay({position:pos,content:el,yAnchor:0.5});
    ov.setMap(map);routeLayers.push(ov);
  });
  map.setBounds(bounds);
  const schedLabel=currentSched==='전체'?'전체':currentSched;
  document.getElementById('rinfo').textContent=`${s.name}(${schedLabel}) 최적경로: ${opt.length}개 건물`;
}

// ===== SIDEBAR =====
function visible(bld){
  if(bdataDeleted && bdataDeleted.has(bld.id)) return false;
  if(searchQuery) {
    const q = searchQuery.toLowerCase();
    return (bld.건물명||'').toLowerCase().includes(q) || 
           (bld.관명||'').toLowerCase().includes(q) ||
           (bld.주소||'').toLowerCase().includes(q);
  }
  if(currentFilter==='전체') return true;
  return bld.sheet===currentFilter;
}

function renderStaffPanel(){
  const p=document.getElementById('staff-panel');
  p.innerHTML=staffList.map(s=>{
    const viewArea=getStaffViewArea(s.id);
    const pct=Math.min(100,Math.round(viewArea/areaLimit*100));
    const over=viewArea>areaLimit;
    const gcolor=over?'#dc2626':pct>70?'#ca8a04':'#03c75a';
    
    // 스케줄별 breakdown
    const breakdown=SCHEDS.map(sch=>{
      const a=getStaffSchedArea(s.id,sch);
      const c=SCHED_COLORS[sch];
      const bg=SCHED_BG[sch];
      return `<div class="sched-box" style="background:${bg}">
        <div class="sched-box-label" style="color:${c}">${sch}</div>
        <div class="sched-box-val" style="color:${c}">${a}평</div>
      </div>`;
    }).join('');
    
    // 배정 목록 (현재 스케줄 뷰 기준)
    const items=[];
    BDATA.forEach(b=>{
      const scheds2=currentSched==='전체'?SCHEDS:[currentSched];
      const myFloors=b.층들.filter((f,fi)=>scheds2.some(sch=>getAss(b.id,fi,sch)==s.id));
      if(myFloors.length) items.push({bld:b,floors:myFloors});
    });
    const rows=items.slice(0,5).map((it,i)=>`<div class="staff-list-item">
      <span style="color:#aaa;font-size:10px;width:14px">${i+1}.</span>
      <span style="font-weight:700">${it.bld.관명}</span>
      <span style="color:#888;font-size:10px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">&nbsp;${it.bld.건물명}</span>
    </div>`).join('');
    
    return `<div class="staff-card">
      <div class="staff-top">
        <div class="staff-dot" style="background:${s.color};cursor:pointer;position:relative;" onclick="openColorPicker(${s.id},this)" title="색상 변경"></div>
        <input class="staff-name-in" value="${s.name}" onchange="renameStaff(${s.id},this.value)">
        <span class="staff-meta">${viewArea}평</span>
        <button class="btn-del" onclick="deleteStaff(${s.id})">×</button>
      </div>
      <div class="area-gauge-track"><div class="area-gauge-fill" style="width:${pct}%;background:${gcolor}"></div></div>
      <div class="area-gauge-labels">
        <span>${viewArea}평 (${currentSched==='전체'?'전체합산':currentSched})</span>
        <span class="${over?'over':''}">${over?'⚠️초과':pct+'% / '+areaLimit+'평'}</span>
      </div>
      <div class="sched-breakdown">${breakdown}</div>
      <div class="staff-list-items">${rows||'<span style="color:#bbb">배정 없음</span>'}</div>
      ${items.length>5?`<div style="font-size:10px;color:#1a73e8;margin-top:3px">+${items.length-5}개 더...</div>`:''}
    </div>`;
  }).join('')+`<button class="btn-add-staff" onclick="addStaff()">+ 담당자 추가</button>`;
}

function updateStats(){
  const blds=[...new Set(BDATA.map(b=>b.건물명))].length;
  const scheds=getActiveScheds();
  let a=0,u=0,total=0;
  BDATA.forEach(b=>{
    b.층들.forEach((f,fi)=>{
      const assigned=scheds.some(sch=>getAss(b.id,fi,sch));
      if(assigned) a++; else u++;
      total+=f.면적;
    });
  });
  document.getElementById('sb').textContent=blds;
  document.getElementById('ss').textContent=BDATA.length;
  document.getElementById('sa').textContent=a;
  document.getElementById('su').textContent=u;
  document.getElementById('stotal').textContent=total.toLocaleString();
  const anyOver=staffList.some(s=>getStaffViewArea(s.id)>areaLimit);
  document.getElementById('hstat').innerHTML='';
  // update sched counts
  SCHEDS.forEach(sch=>{
    const el=document.getElementById('sc-'+sch);
    if(el) el.textContent=getSchedCount(sch);
  });
  const totCount=SCHEDS.reduce((s,sch)=>s+getSchedCount(sch),0);
  document.getElementById('sc-전체').textContent=totCount;
  // 주간/야간 카운트
  const 주간Scheds=SCHEDS.filter(s=>s.startsWith('주간-'));
  const 야간Scheds=SCHEDS.filter(s=>s.startsWith('야간-'));
  const countScheds=(scheds)=>{
    const cnt=new Set();
    BDATA.filter(b=>visible(b)).forEach(b=>b.층들.forEach((_,fi)=>scheds.forEach(sch=>{if(getAss(b.id,fi,sch))cnt.add(b.id+'-'+fi+'-'+sch);})));
    return cnt.size;
  };
  const 주간El=document.getElementById('sc-주간');
  const 야간El=document.getElementById('sc-야간');
  if(주간El) 주간El.textContent=countScheds(주간Scheds);
  if(야간El) 야간El.textContent=countScheds(야간Scheds);
}

function getActiveScheds(){
  if(currentShift==='전체' && currentDay==='전체') return SCHEDS;
  const DAYS_KR=['월','화','수','목','금','토','일'];
  const shifts=['주간','야간'];
  const dayFilter = currentDay==='전체' ? DAYS_KR : [currentDay];
  const shiftFilter = currentShift==='전체' ? shifts : [currentShift];
  const result=[];
  shiftFilter.forEach(sh=>dayFilter.forEach(d=>result.push(sh+'-'+d)));
  return result;
}

let bdataOverrides = {}; // 수정된 건물 데이터 (id → 수정내용)
let bdataDeleted = new Set(); // 삭제된 건물 id

function renderBldMgmt(q=''){
  const query = (q||'').toLowerCase();
  const list = document.getElementById('bld-mgmt-list');
  const items = BDATA.filter(b => {
    if(bdataDeleted.has(b.id)) return false;
    if(!query) return true;
    return (b.관명||'').toLowerCase().includes(query) ||
           (b.건물명||'').toLowerCase().includes(query) ||
           (b.주소||'').toLowerCase().includes(query);
  });
  if(!items.length){list.innerHTML='<div style="text-align:center;color:#aaa;padding:20px;font-size:12px;">검색 결과 없음</div>';return;}
  list.innerHTML = items.map(b => {
    const ov = bdataOverrides[b.id] || {};
    const 관명 = ov.관명 ?? b.관명;
    const 건물명 = ov.건물명 ?? b.건물명;
    const 주소 = ov.주소 ?? b.주소;
    const lat = ov.lat ?? b.lat;
    const lng = ov.lng ?? b.lng;
    return `<div class="bld-mgmt-card" id="bmc-${b.id}">
      <div class="bm-header">
        <div>
          <div class="bm-name">${관명}</div>
          <div class="bm-sub">${건물명} · ${b.sheet}</div>
        </div>
      </div>
      <div class="bm-field"><label>관명</label><input id="bm-nm-${b.id}" value="${관명}"></div>
      <div class="bm-field"><label>건물명</label><input id="bm-bn-${b.id}" value="${건물명}"></div>
      <div class="bm-field"><label>주소</label><input id="bm-addr-${b.id}" value="${주소}"></div>
      <div class="bm-field"><label>위도</label><input id="bm-lat-${b.id}" value="${lat}" type="number" step="0.0001"></div>
      <div class="bm-field"><label>경도</label><input id="bm-lng-${b.id}" value="${lng}" type="number" step="0.0001"></div>
      <div class="bm-actions">
        <button class="bm-btn save" onclick="saveBldEdit(${b.id})">저장</button>
        <button class="bm-btn del" onclick="deleteBld(${b.id})">삭제</button>
      </div>
    </div>`;
  }).join('');
}

function saveBldEdit(id){
  const b = BDATA.find(x=>x.id===id);
  if(!b) return;
  const 관명 = document.getElementById(`bm-nm-${id}`).value.trim();
  const 건물명 = document.getElementById(`bm-bn-${id}`).value.trim();
  const 주소 = document.getElementById(`bm-addr-${id}`).value.trim();
  const lat = parseFloat(document.getElementById(`bm-lat-${id}`).value);
  const lng = parseFloat(document.getElementById(`bm-lng-${id}`).value);
  // BDATA 직접 수정
  b.관명=관명; b.건물명=건물명; b.주소=주소; b.lat=lat; b.lng=lng;
  bdataOverrides[id] = {관명,건물명,주소,lat,lng};
  // geocode 캐시 초기화
  if(window.geocodeCache) delete geocodeCache[b.주소];
  // Supabase 저장
  sbSaveBldEdit(b);
  renderBldMgmt(document.getElementById('bm-search')?.value||'');
  renderMarkers();
  showToast('✅ 저장됐어요!');
}

function deleteBld(id){
  if(!confirm('이 관명을 목록에서 숨길까요? (배정 데이터는 유지됩니다)')) return;
  bdataDeleted.add(id);
  sbDeleteBld(id);
  renderBldMgmt(document.getElementById('bm-search')?.value||'');
  renderAll();
  showToast('삭제됐어요');
}

async function submitAddBld(){
  const 관명=document.getElementById('ab-nm').value.trim();
  const 건물명=document.getElementById('ab-bn').value.trim();
  const 주소=document.getElementById('ab-addr').value.trim();
  const sheet=document.getElementById('ab-sheet').value;
  const 구분=document.getElementById('ab-type').value;
  if(!관명||!주소){alert('관명과 주소는 필수입니다');return;}

  // 층 정보 수집
  const rows=[...document.getElementById('ab-floors').children];
  const 층들=rows.map(r=>{
    const inputs=r.querySelectorAll('input');
    return {층:inputs[0].value.trim(),면적:parseFloat(inputs[1].value)||0};
  }).filter(f=>f.층);
  const 총면적=층들.reduce((s,f)=>s+f.면적,0);

  // 좌표 검색
  let lat=37.498, lng=127.060;
  try {
    const res=await fetch(`https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(주소)}`,{headers:{Authorization:`KakaoAK ${KAKAO_API_KEY}`}});
    const data=await res.json();
    if(data.documents?.length){lat=parseFloat(data.documents[0].y);lng=parseFloat(data.documents[0].x);}
  } catch(e){}

  const newId=Math.max(...BDATA.map(b=>b.id))+1;
  const newBld={id:newId,sheet,구분,건물명,주소,관명,층들,총면적,lat,lng};
  BDATA.push(newBld);

  // Supabase 저장
  await sbSaveBldEdit(newBld);

  closeAddBldModal();
  renderAll();
  if(currentTab===2) renderBldMgmt('');
  showToast(`✅ ${관명} 추가됐어요!`);
}

function showToast(msg){
  let t=document.getElementById('hc-toast');
  if(!t){t=document.createElement('div');t.id='hc-toast';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1d2e;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';
  setTimeout(()=>t.style.opacity='0',2500);
}

async function sbSaveBldEdit(b){
  try {
    await fetch(`${SB_URL}/rest/v1/hc_buildings?id=eq.${b.id}`, {
      method: 'DELETE', headers: SB_HEAD()
    });
    await fetch(`${SB_URL}/rest/v1/hc_buildings`, {
      method: 'POST', headers: SB_HEAD(),
      body: JSON.stringify({id:b.id,관명:b.관명,건물명:b.건물명,주소:b.주소,sheet:b.sheet,lat:b.lat,lng:b.lng,총면적:b.총면적,층들:b.층들,active:true})
    });
  } catch(e){}
}

  const DAYS = ['월','화','수','목','금','토','일'];
  const s1rows = [
    ['건물명','관명','주소','구분','지역','층/호','면적(평)',
     '주간-월','주간-화','주간-수','주간-목','주간-금','주간-토','주간-일',
     '야간-월','야간-화','야간-수','야간-목','야간-금','야간-토','야간-일']
  ];
  BDATA.filter(b=>!bdataDeleted.has(b.id)).forEach(b=>{
    b.층들.forEach((f,fi)=>{
      const row = [b.건물명, b.관명, b.주소, b.구분, b.sheet, f.층, f.면적];
      DAYS.forEach(d=>{
        const sid=getAss(b.id,fi,'주간-'+d);
        const st=sid?staffList.find(x=>x.id==sid):null;
        row.push(st?st.name:'');
      });
      DAYS.forEach(d=>{
        const sid=getAss(b.id,fi,'야간-'+d);
        const st=sid?staffList.find(x=>x.id==sid):null;
        row.push(st?st.name:'');
      });
      s1rows.push(row);
    });
  });

  // ── 시트2: 담당자별 담당 건물 ──
  const s2rows = [['담당자','건물명','관명','주소','구분','지역','스케줄']];
  staffList.forEach(s=>{
    BDATA.filter(b=>!bdataDeleted.has(b.id)).forEach(b=>{
      b.층들.forEach((f,fi)=>{
        const scheds=[];
        SCHEDS.forEach(sch=>{ if(getAss(b.id,fi,sch)==s.id) scheds.push(sch); });
        if(scheds.length) s2rows.push([s.name,b.건물명,b.관명,b.주소,b.구분,b.sheet,scheds.join(', ')]);
      });
    });
  });

  // ── 시트3: 전체 건물 목록 ──
  const s3rows = [['건물명','관명','주소','구분','지역','층/호','면적(평)','총면적(평)']];
  BDATA.filter(b=>!bdataDeleted.has(b.id)).forEach(b=>{
    b.층들.forEach((f,fi)=>{
      s3rows.push([b.건물명, b.관명, b.주소, b.구분, b.sheet, f.층, f.면적, fi===0?b.총면적:'']);
    });
  });

  // SheetJS로 변환
  if(typeof XLSX === 'undefined'){
    // SheetJS 동적 로드
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = ()=> buildAndDownload(s1rows, s2rows, s3rows);
    document.head.appendChild(script);
  } else {
    buildAndDownload(s1rows, s2rows, s3rows);
  }
}

function buildAndDownload(s1rows, s2rows, s3rows){
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s1rows), '배정현황');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s2rows), '담당자별배정');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s3rows), '전체건물목록');
  const now = new Date();
  const fname = `하이컨시_배정현황_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.xlsx`;
  XLSX.writeFile(wb, fname);
}

function openColorPicker(staffId, dotEl){
  // 기존 피커 닫기
  const existing = document.getElementById('color-picker-popup');
  if(existing) { existing.remove(); if(existing.dataset.sid==staffId) return; }

  const popup = document.createElement('div');
  popup.id = 'color-picker-popup';
  popup.dataset.sid = staffId;
  popup.style.cssText = 'position:fixed;z-index:9999;background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px;box-shadow:0 4px 20px rgba(0,0,0,0.2);width:220px;';

  // 위치 계산
  const rect = dotEl.getBoundingClientRect();
  popup.style.left = Math.min(rect.left, window.innerWidth-230) + 'px';
  popup.style.top = (rect.bottom + 6) + 'px';

  popup.innerHTML = `
    <div style="font-size:11px;font-weight:700;color:#555;margin-bottom:8px;">색상 선택</div>
    <div style="display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-bottom:8px;">
      ${COLOR_PALETTE.map(c=>`
        <div onclick="applyColor(${staffId},'${c}')" style="width:18px;height:18px;border-radius:50%;background:${c};cursor:pointer;border:2px solid transparent;transition:transform 0.1s;" onmouseover="this.style.transform='scale(1.3)'" onmouseout="this.style.transform='scale(1)'"></div>
      `).join('')}
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <span style="font-size:11px;color:#888;">직접 입력:</span>
      <input type="color" id="custom-color-input" value="#1a73e8" style="width:36px;height:24px;border:none;cursor:pointer;border-radius:4px;">
      <button onclick="applyColor(${staffId},document.getElementById('custom-color-input').value)" style="padding:3px 8px;background:#1a73e8;color:#fff;border:none;border-radius:5px;font-size:11px;cursor:pointer;">적용</button>
    </div>
  `;

  document.body.appendChild(popup);

  // 바깥 클릭 닫기
  setTimeout(()=>{

function applyColor(staffId, color){
  const s = staffList.find(x=>x.id===staffId);
  if(!s) return;
  s.color = color;
  sbSaveStaff();
  renderStaffPanel();
  renderMarkers();
  renderLegend();
  renderRouteControls();
  const p = document.getElementById('color-picker-popup');
  if(p) p.remove();
}

function addStaff(){
  staffList.push({id:nextSid++,name:`담당자 ${staffList.length+1}`,color:COLORS[staffList.length%COLORS.length]});
  renderAll();
  sbSaveStaff();
}

function deleteStaff(id){
  if(staffList.length<=1){alert('최소 1명 필요');return;}
  if(!confirm('해당 담당자 배정이 모두 초기화됩니다.')) return;
  staffList=staffList.filter(s=>s.id!==id);
  Object.values(assignments).forEach(fi=>{Object.values(fi||{}).forEach(schMap=>{
    Object.keys(schMap||{}).forEach(sch=>{if(schMap[sch]===id) delete schMap[sch];});
  });});
  delete visibleRoutes[id];
  renderAll();
  sbSaveStaff();
}

function renameStaff(id,name){
  const s=staffList.find(x=>x.id===id);
  if(s) { s.name=name; sbSaveStaff(); }
  renderBuildingList();renderRouteControls();renderLegend();
}

function renderAll(){
  renderBuildingList();renderMarkers();renderRouteControls();renderLegend();updateStats();
  if(currentTab===1) renderStaffPanel();
}

function openPrint(){
  const overlay=document.getElementById('print-overlay');
  const content=document.getElementById('print-content');
  const today=new Date().toLocaleDateString('ko-KR');
  const schedsToPrint=currentSched==='전체'?SCHEDS:[currentSched];
  
  const totalArea=BDATA.reduce((s,b)=>s+b.총면적,0);
  let totalAssigned=0;
  BDATA.forEach(b=>{b.층들.forEach((f,fi)=>{if(schedsToPrint.some(sch=>getAss(b.id,fi,sch))) totalAssigned++;});});
  
  const schedColor=currentSched==='전체'?'#1a1d2e':(SCHED_COLORS[currentSched]||'#1a1d2e');
  const schedLabel=currentSched==='전체'?'전체 스케줄':currentSched;
  
  const sumBoxes=[
    {l:'총 관명',v:BDATA.length,u:'개'},
    {l:'총 층',v:BDATA.reduce((s,b)=>s+b.층들.length,0),u:'층'},
    {l:'배정 완료',v:totalAssigned,u:'층'},
    {l:'총 면적',v:totalArea.toLocaleString(),u:'평'},
    {l:'1인당 기준',v:areaLimit,u:'평'},
  ];
  
  // 스케줄별로 섹션 나누거나, 스케줄 선택 시 해당만
  let staffBlocks='';
  schedsToPrint.forEach(sch=>{
    const schColor=SCHED_COLORS[sch];
    const schBg=SCHED_BG[sch];
    const blocks=staffList.map(s=>{
      const pts=[];const seen=new Set();
      BDATA.forEach(b=>{
        const myFloors=b.층들.filter((f,fi)=>getAss(b.id,fi,sch)==s.id);
        if(myFloors.length&&!seen.has(b.id)){seen.add(b.id);pts.push({bld:b,floors:myFloors});}
      });
      if(!pts.length) return '';
      // optimize
      const sorted=[pts[0]];const rem=pts.slice(1);
      while(rem.length){
        const last=sorted[sorted.length-1];let ni=0,md=Infinity;
        rem.forEach((p,i)=>{const d=Math.hypot(p.bld.lat-last.bld.lat,p.bld.lng-last.bld.lng);if(d<md){md=d;ni=i;}});
        sorted.push(rem.splice(ni,1)[0]);
      }
      const area=getStaffSchedArea(s.id,sch);
      const pct=Math.min(100,Math.round(area/areaLimit*100));
      const over=area>areaLimit;
      const rows=sorted.map((it,i)=>{
        const myArea=it.floors.reduce((s,f)=>s+f.면적,0);
        return `<div class="psb-row">
          <span class="psb-num">${i+1}</span>
          <span class="psb-guan">${it.bld.관명}</span>
          <span class="psb-bld">${it.bld.건물명}</span>
          <span class="psb-floors">${it.floors.map(f=>f.층).join(', ')}</span>
          <span class="psb-area">${myArea}평</span>
        </div>`;
      }).join('');
      return `<div class="print-staff-block">
        <div class="psb-header" style="background:${s.color}">
          <span class="psb-header-name">${s.name}</span>
          <span style="font-size:10px;background:${schBg};color:${schColor};padding:1px 6px;border-radius:8px;margin-left:4px">${sch}</span>
          <span class="psb-header-meta">${sorted.length}건물·${area}평${over?' ⚠️':''}</span>
        </div>
        <div class="psb-gauge"><div class="psb-gauge-fill" style="width:${pct}%"></div></div>
        <div class="psb-body">${rows}</div>
      </div>`;
    }).filter(Boolean).join('');
    if(blocks){
      staffBlocks+=`<div style="margin-bottom:12px">
        <div style="font-size:12px;font-weight:800;color:${schColor};padding:5px 0;border-bottom:2px solid ${schColor};margin-bottom:8px">
          ${sch==='평일주간'?'☀️':sch==='평일야간'?'🌙':sch==='주말주간'?'🌤️':'🌃'} ${sch}
        </div>
        <div class="print-grid">${blocks}</div>
      </div>`;
    }
  });
  
  content.innerHTML=`<div class="print-page">
    <div class="print-logo-row">
      <span class="print-logo">둥지</span>
      <span class="print-title">하이컨시(시대인재) 청소 담당자 배정표</span>
      <span class="print-sched-label" style="background:${schedColor}">${schedLabel}</span>
      <span class="print-date">${today} · 1인당 ${areaLimit}평 기준</span>
    </div>
    <hr class="print-divider">
    <div class="print-summary">${sumBoxes.map(b=>`<div class="print-sum-box">
      <div class="print-sum-label">${b.l}</div>
      <div><span class="print-sum-val">${b.v}</span><span class="print-sum-unit"> ${b.u}</span></div>
    </div>`).join('')}</div>
    ${staffBlocks}
  </div>`;
  overlay.classList.add('show');
}

function closePrint(){document.getElementById('print-overlay').classList.remove('show');}

const SB_HEAD = () => ({'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'});

async function sbLoad() {
  try {
    const [sRes, aRes] = await Promise.all([
      fetch(`${SB_URL}/rest/v1/hc_staff?order=id`, {headers:SB_HEAD()}),
      fetch(`${SB_URL}/rest/v1/hc_assignments?select=*`, {headers:SB_HEAD()})
    ]);
    if (!sRes.ok || !aRes.ok) throw new Error('API error');
    const staffData = await sRes.json();
    const assData = await aRes.json();

    // 담당자: DB에 있으면 덮어쓰기, 없으면 기본값 유지
    if (Array.isArray(staffData) && staffData.length) {
      staffList = staffData.map(s => ({id:s.id, name:s.name, color:s.color}));
      nextSid = Math.max(...staffList.map(s=>s.id)) + 1;
    } else {
      // DB 비어있으면 기본 담당자 자동 저장
      await sbSaveStaff();
    }

    // 배정: DB에 있으면 반영, 없으면 기존 유지
    if (Array.isArray(assData) && assData.length) {
      assignments = {};
      assData.forEach(a => {
        if (!assignments[a.bld_id]) assignments[a.bld_id] = {};
        if (!assignments[a.bld_id][a.floor_idx]) assignments[a.bld_id][a.floor_idx] = {};
        if (a.staff_id) assignments[a.bld_id][a.floor_idx][a.sched] = a.staff_id;
      });
    }

    // 건물 수정/삭제 내용 로드
    const bldRes = await fetch(`${SB_URL}/rest/v1/hc_buildings?select=*`, {headers:SB_HEAD()});
    if(bldRes.ok){
      const bldData = await bldRes.json();
      if(Array.isArray(bldData)){
        bldData.forEach(row=>{
          const b = BDATA.find(x=>x.id===row.id);
          if(!b) return;
          if(row.active===false){ bdataDeleted.add(row.id); return; }
          b.관명=row.관명; b.건물명=row.건물명; b.주소=row.주소; b.lat=row.lat; b.lng=row.lng;
          bdataOverrides[row.id]={관명:row.관명,건물명:row.건물명,주소:row.주소,lat:row.lat,lng:row.lng};
        });
      }
    }

    document.getElementById('sbDot').style.background = '#03c75a';
    document.getElementById('sbStatus').textContent = '동기화됨 · ' + new Date().toLocaleTimeString('ko-KR');
    renderAll();
  } catch(e) {
    document.getElementById('sbDot').style.background = '#dc2626';
    document.getElementById('sbStatus').textContent = '연결 오류 (로컬 데이터 유지)';
    renderAll(); // 에러나도 기존 데이터로 렌더
  }
}

async function sbSaveAssignment(bldId, fi, sch, sid) {
  try {
    if (sid) {
      await fetch(`${SB_URL}/rest/v1/hc_assignments`, {
        method: 'POST',
        headers: {...SB_HEAD(), 'Prefer': 'resolution=merge-duplicates,return=representation'},
        body: JSON.stringify({bld_id:bldId, floor_idx:fi, sched:sch, staff_id:sid, updated_at:new Date().toISOString()})
      });
    } else {
      await fetch(`${SB_URL}/rest/v1/hc_assignments?bld_id=eq.${bldId}&floor_idx=eq.${fi}&sched=eq.${sch}`, {
        method: 'DELETE', headers: SB_HEAD()
      });
    }
    document.getElementById('sbStatus').textContent = '저장됨 · ' + new Date().toLocaleTimeString('ko-KR');
  } catch(e) {
    document.getElementById('sbStatus').textContent = '저장 오류';
  }
}

async function sbSaveStaff() {
  try {
    // 전체 staff 동기화: delete all → insert
    await fetch(`${SB_URL}/rest/v1/hc_staff?id=gte.1`, {method:'DELETE', headers:SB_HEAD()});
    if (staffList.length) {
      await fetch(`${SB_URL}/rest/v1/hc_staff`, {
        method: 'POST', headers: SB_HEAD(),
        body: JSON.stringify(staffList.map(s=>({id:s.id, name:s.name, color:s.color})))
      });
    }
    document.getElementById('sbStatus').textContent = '저장됨 · ' + new Date().toLocaleTimeString('ko-KR');
  } catch(e) {}
}
